<!DOCTYPE html>
<html lang="de" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dienstplan — Bar Rennbahn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   1 — Farben und Grundwerte
   ============================================================ */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#E9EBEF; --line:#D5D9E0;
  --ink:#171B22; --ink-2:#5A6270; --ink-3:#868E9C;
  --accent:#A96A12; --accent-ink:#FFFFFF; --accent-soft:#F6E9D5;
  --ok:#27714F; --ok-soft:#DEF0E6; --ok-line:#9DCDB4;
  --no:#A8332B; --no-soft:#F8E3E1; --no-line:#E0A9A4;
  --shadow:0 1px 2px rgba(20,26,36,.07), 0 10px 28px rgba(20,26,36,.06);
  --r:10px; --pad:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151C; --surface:#1A1F29; --surface-2:#232A36; --line:#2F3743;
    --ink:#E7EAF0; --ink-2:#99A2B1; --ink-3:#727C8B;
    --accent:#E0A33C; --accent-ink:#1C1403; --accent-soft:#33291A;
    --ok:#63C695; --ok-soft:#173627; --ok-line:#2C5C45;
    --no:#EC8479; --no-soft:#3A1E1C; --no-line:#663631;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1A1F29; --surface-2:#232A36; --line:#2F3743;
  --ink:#E7EAF0; --ink-2:#99A2B1; --ink-3:#727C8B;
  --accent:#E0A33C; --accent-ink:#1C1403; --accent-soft:#33291A;
  --ok:#63C695; --ok-soft:#173627; --ok-line:#2C5C45;
  --no:#EC8479; --no-soft:#3A1E1C; --no-line:#663631;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; font-variant-numeric:tabular-nums; overflow-x:hidden;
}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.02em; line-height:1.15}
button,input,textarea{font:inherit; color:inherit; font-variant-numeric:tabular-nums}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; scroll-behavior:auto!important}}

/* ============================================================
   2 — Bausteine
   ============================================================ */
.wrap{max-width:1240px; margin:0 auto; padding:0 var(--pad); width:100%}
.row{display:flex; align-items:center; gap:10px}
.grow{flex:1; min-width:0}
.stack{display:grid; gap:14px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow)}

.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  padding:9px 14px; border-radius:var(--r); font-weight:600; font-size:14px;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  transition:border-color .12s, background .12s; white-space:nowrap;
}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2); padding:7px 9px}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.danger{color:var(--no); border-color:var(--no-line); background:transparent}
.btn.sm{padding:5px 10px; font-size:13px}
.btn:disabled{opacity:.45; cursor:not-allowed}

.field{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); color:var(--ink)}
.field:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.lbl{display:block; font-size:13px; font-weight:600; color:var(--ink-2); margin:0 0 6px}
.err{color:var(--no); font-size:13px; font-weight:600; margin:0}
.okmsg{color:var(--ok); font-size:13px; font-weight:600; margin:0}

.pill{display:inline-flex; align-items:center; gap:7px; padding:6px 11px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; color:var(--ink-2)}
.pill b{color:var(--ink)}
.pill.done{background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok)}
.pill.done b{color:var(--ok)}
.pill.warn{background:var(--no-soft); border-color:var(--no-line); color:var(--no)}
.pill.warn b{color:var(--no)}

.banner{padding:12px 14px; border-radius:var(--r); font-size:14px; margin-bottom:14px; border:1px solid}
.banner.ok{background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok)}
.banner.info{background:var(--surface); border-color:var(--line); color:var(--ink-2)}
.banner.bad{background:var(--no-soft); border-color:var(--no-line); color:var(--no)}

/* ============================================================
   3 — Anmeldung
   ============================================================ */
.login{min-height:100dvh; display:grid; place-items:center; padding:22px}
.login-card{width:100%; max-width:390px; padding:28px 24px 24px}
.mark{display:flex; align-items:baseline; gap:9px; margin-bottom:22px}
.mark .dot{width:11px; height:11px; border-radius:50%; background:var(--accent); flex:none; transform:translateY(-2px)}
.mark h1{font-size:26px}
.mark p{margin:2px 0 0; font-size:13px; color:var(--ink-2)}
.switch-link{background:none; border:none; color:var(--ink-2); font-size:13px; text-decoration:underline; padding:6px 0}
.switch-link:hover{color:var(--ink)}
.patch{text-align:center; font-size:11px; color:var(--ink-3); margin:30px 0 0}
.login .patch{margin:18px 0 0}
.boot{min-height:100dvh; display:grid; place-items:center; color:var(--ink-3); font-size:14px; padding:24px; text-align:center}

/* ============================================================
   4 — Kopfzeile
   ============================================================ */
header.top{position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--line)}
.top-in{display:flex; align-items:center; gap:10px; padding:9px 0; min-height:52px}
.who{font-weight:700; font-size:16px; letter-spacing:-.01em; min-width:0}
.who span{display:block; font-size:12px; font-weight:500; color:var(--ink-2); letter-spacing:0}
.sync{font-size:12px; font-weight:600; color:var(--ink-3); white-space:nowrap}
.sync.saving{color:var(--accent)}
.sync.bad{color:var(--no)}
.tabs{display:flex; gap:4px; padding:0 0 8px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none; background:transparent; color:var(--ink-2); font-weight:600; font-size:14px;
  padding:7px 12px; border-radius:8px; white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface-2); color:var(--ink)}
main{padding:16px 0 110px}

/* ============================================================
   5 — Monatsleiste
   ============================================================ */
.monthbar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.mnav{display:flex; align-items:center; gap:8px; min-width:0}
.mnav .m{font-size:20px; font-weight:700; letter-spacing:-.02em; white-space:nowrap}
.arrow{flex:none; width:38px; height:38px; padding:0; border-radius:9px; font-size:17px}
.macts{display:flex; gap:8px; margin-left:auto}

/* ============================================================
   6 — Mitarbeiterkalender
   ============================================================ */
/* Eine Zeile je Tag: Datum links, wer nicht kann in der Mitte, eigener Zustand rechts */
.days{display:flex; flex-direction:column; gap:5px}
.drow{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:9px 11px; min-height:52px; color:inherit; font:inherit;
  transition:border-color .12s;
}
.drow:hover:not(:disabled){border-color:var(--ink-3)}
.drow:disabled{cursor:default}
.drow .dt{font-weight:700; white-space:nowrap; width:54px; flex:none; font-size:15px}
.drow .dt em{font-style:normal; color:var(--ink-2); font-weight:600; font-size:13px}
/* eigene Klassennamen, damit keine Regel aus Kopfzeile oder Anmeldung hereinwirkt */
.drow .wer{flex:1; min-width:0; font-size:13px; font-weight:600; color:var(--no); line-height:1.35}
.drow .wer.frei{color:var(--ink-3); font-weight:500}
.drow .kreuz{flex:none; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line);
  display:grid; place-items:center; font-size:14px; font-weight:700; color:transparent}
.drow.off{background:var(--no-soft); border-color:var(--no-line)}
.drow.off .dt{color:var(--no)}
.drow.off .kreuz{background:var(--no); border-color:var(--no); color:#fff}
.drow.heute{box-shadow:inset 0 0 0 2px var(--accent)}
.drow.zu{background:var(--surface-2); border-style:dashed; min-height:40px; opacity:.75}
.drow.zu .dt{color:var(--ink-3)}
.drow.zu .wer{color:var(--ink-3); font-weight:500; font-style:italic}
.wsep{height:1px; background:var(--line); margin:6px 2px}
.hint{margin:0 0 12px; font-size:14px; color:var(--ink-2)}
.legend{display:flex; gap:16px; flex-wrap:wrap; margin:12px 0 0; font-size:13px; color:var(--ink-2)}
.legend i{width:12px; height:12px; border-radius:3px; display:inline-block; margin-right:6px; vertical-align:-1px}

.sticky-bar{position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--surface); border-top:1px solid var(--line);
  padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom))}
.sticky-in{max-width:1240px; margin:0 auto; display:flex; align-items:center; gap:12px}

/* ============================================================
   7 — Planung
   ============================================================ */
.fold{padding:12px 14px}
.fold summary{display:flex; align-items:center; gap:8px; flex-wrap:wrap; cursor:pointer; list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold .caret{margin-left:auto; color:var(--ink-3); font-size:13px}
.fold[open] .caret::after{content:"▲"}
.fold:not([open]) .caret::after{content:"▼"}
.checklist{margin-bottom:12px}
.checklist ul{list-style:none; margin:11px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:7px}
.checklist li{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600;
  padding:5px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink-2)}
.checklist li.yes{background:var(--ok-soft); color:var(--ok)}

.planhead{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.daystrip{display:flex; gap:5px; overflow-x:auto; padding:2px 2px 10px; scrollbar-width:thin}
.ds{flex:none; width:32px; height:32px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink-2); font-size:13px; font-weight:600; padding:0}
.ds.part{border-color:var(--accent); color:var(--ink)}
.ds.full{background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok)}
.ds.rest{background:transparent; border-style:dashed; color:var(--ink-3)}

.board{display:flex; gap:12px; align-items:stretch; overflow-x:auto;
  padding:2px 2px 16px; margin:0;
  scroll-snap-type:x proximity; scroll-padding-left:2px;
  -webkit-overflow-scrolling:touch}
.col{flex:0 0 248px; max-width:86vw; scroll-snap-align:start; display:flex; flex-direction:column;
  background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.col.full{border-color:var(--ok-line)}
.col.rest{opacity:.62}
.colhead{padding:10px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px}
.col.full .colhead{background:var(--ok-soft); border-bottom-color:var(--ok-line)}
.colhead .d{font-weight:700; font-size:15px}
.colhead .d span{color:var(--ink-2); font-weight:600}
.check{margin-left:auto; width:22px; height:22px; border-radius:50%; background:var(--ok); color:#fff;
  display:grid; place-items:center; font-size:13px; flex:none}
.colbody{padding:10px 12px 12px; flex:1; display:flex; flex-direction:column}
.colbody > .btn{align-self:flex-start}
.notewrap{margin-top:auto; padding-top:4px}

.slot{border:1px dashed var(--line); border-radius:var(--r); padding:8px 10px; margin-bottom:7px;
  background:var(--bg); display:flex; flex-direction:column; gap:6px}
.slot.filled{border-style:solid; background:var(--surface)}
.slot.over{border-color:var(--accent); background:var(--accent-soft)}
.slot.armed{border-color:var(--accent)}
.slot.conflict{border-color:var(--no); background:var(--no-soft)}
.slot-top{display:flex; align-items:baseline; gap:8px}
.slot-top .t{font-weight:700; font-size:14px; letter-spacing:-.01em; flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.slot-top .n{font-size:12px; color:var(--ink-2); font-weight:600; white-space:nowrap; flex:none}
.slot-bot{display:flex; align-items:center; gap:6px; min-height:30px}
.slot-bot .free{flex:1; min-width:0; font-size:12px; font-weight:600; color:var(--ink-3)}
.slot.armed .slot-bot .free{color:var(--accent)}
.who-chip{background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:13px;
  padding:6px 9px; border-radius:8px; flex:0 1 auto; min-width:0; max-width:100%; margin-right:auto;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left}
.who-chip.is-sl{box-shadow:inset 0 0 0 2px var(--ok)}
.who-chip.clash{background:var(--no); color:#fff}
.slbtn{border:1px solid var(--line); background:var(--surface-2); color:var(--ink-3);
  font-size:11px; font-weight:700; padding:5px 6px; border-radius:7px; line-height:1; flex:none}
.slbtn.on{background:var(--ok); border-color:var(--ok); color:#fff}
.iconbtn{border:none; background:transparent; color:var(--ink-3); font-size:16px; padding:2px 4px; line-height:1; flex:none}
.iconbtn:hover{color:var(--ink)}
.iconbtn.x:hover{color:var(--no)}

.slot-edit{display:grid; gap:7px; padding:9px 10px; border:1px solid var(--accent);
  border-radius:var(--r); margin-bottom:7px; background:var(--surface); overflow:hidden}
.slot-edit .two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:7px}
.slot-edit input{padding:7px 8px; font-size:13px; border:1px solid var(--line); border-radius:8px;
  background:var(--bg); width:100%; min-width:0; max-width:100%; text-align:center}
.slot-edit input[data-edit="label"]{text-align:left}
input[type="time"]{
  -webkit-appearance:none; appearance:none;
  min-width:0; width:100%; max-width:100%; text-align:center;
}
input[type="time"]::-webkit-date-and-time-value{text-align:center; margin:0}
input[type="time"]::-webkit-calendar-picker-indicator{display:none}

.grouplbl{font-size:12px; font-weight:700; color:var(--ink-3); margin:12px 0 7px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  padding:6px 10px; border-radius:999px; font-size:13px; font-weight:600}
.chip:hover{border-color:var(--ink-3)}
.chip.sel{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.chip.pending::after{content:"?"; margin-left:5px; color:var(--ink-3); font-weight:700}
.chip.sel.pending::after{color:var(--accent-ink); opacity:.7}
.chip.used{opacity:.38; text-decoration:line-through}
.chip.drag{opacity:.5}
.noteinput{width:100%; border:1px solid var(--line); border-radius:var(--r); padding:8px 10px;
  font-size:13px; background:var(--bg); resize:vertical; min-height:38px}
.empty-note{font-size:13px; color:var(--ink-3); padding:6px 0}

/* ============================================================
   8 — Listen, Team, Einstellungen
   ============================================================ */
.panel{padding:16px; margin-bottom:14px}
.panel h2{font-size:17px; margin-bottom:4px}
.panel > p{margin:0 0 14px; color:var(--ink-2); font-size:14px}
.list{list-style:none; margin:0; padding:0}
.list li{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:none}
.list .nm{font-weight:600}
.status{font-size:12px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--surface-2); color:var(--ink-2)}
.status.yes{background:var(--ok-soft); color:var(--ok)}

/* Schalter — eine Zeile je Einstellung, Beschriftung links, Schalter rechts */
.sw{display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:10px 0; min-height:44px; cursor:pointer; user-select:none;
  border-top:1px solid var(--line)}
.sw:first-child{border-top:none}
.sw > span.sw-t{font-size:14px; font-weight:600; min-width:0}
.sw:has(input:disabled){cursor:not-allowed}
.sw:has(input:disabled) > span.sw-t{color:var(--ink-3)}
.sw input{position:absolute; opacity:0; width:0; height:0; pointer-events:none}
.sw-b{flex:none; width:40px; height:24px; border-radius:999px; position:relative;
  background:var(--surface-2); border:1px solid var(--line); transition:background .15s, border-color .15s}
.sw-b::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
  background:#fff; box-shadow:0 1px 3px rgba(10,14,20,.35); transition:transform .15s}
.sw input:checked + .sw-b{background:var(--accent); border-color:var(--accent)}
.sw input:checked + .sw-b::after{transform:translateX(16px)}
.sw input:disabled + .sw-b{opacity:.35}
.sw input:focus-visible + .sw-b{outline:2px solid var(--accent); outline-offset:3px}

/* Zeile mit Zahleneingabe, gleiche Optik wie die Schalterzeilen */
.swnum{display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:9px 0; min-height:44px; border-top:1px solid var(--line)}
.swnum > .t{font-size:14px; font-weight:600; min-width:0}
.swnum input{flex:none; width:78px; text-align:right; padding:7px 9px; font-size:14px; font-weight:600;
  border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink)}
.swnum input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.swnum .e{font-size:13px; font-weight:500; color:var(--ink-3); flex:none}

/* Eine Karte je Person */
.pcard{border:1px solid var(--line); border-radius:var(--r); padding:11px 13px; margin-bottom:9px}
.pcard.off{opacity:.55}
.pcard .ph{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px}
.pcard .ph .n{font-weight:700; font-size:16px}
/* Zustand und Knopf bleiben rechts, auch wenn die Zeile umbricht */
.pcard .ph .stat, .pcard .ph .ropen{margin-left:auto}

/* Gruppenkopf in der Teamliste */
.grp{font-size:11px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); margin:10px 0 7px; display:flex; align-items:center; gap:9px}
.pcard + .grp{margin-top:18px}
.grp::after{content:""; height:1px; flex:1; background:var(--line)}

/* Reihenfolge ändern: am Griff ziehen */
.grip{flex:none; cursor:grab; color:var(--ink-3); font-size:15px; line-height:1;
  padding:4px 3px; margin-left:-3px; user-select:none}
.grip:active{cursor:grabbing}
.grip:hover{color:var(--ink-2)}
/* Am Touchgerät gibt es kein Ziehen — dort sortiert allein die Gruppierung */
@media (hover:none){ .grip{display:none} }
.pcard.dragging{opacity:.4}
.pcard.dropbefore{box-shadow:inset 0 3px 0 0 var(--accent)}
.pcard.dropafter{box-shadow:inset 0 -3px 0 0 var(--accent)}
.pswitches{display:flex; flex-direction:column; max-width:390px; margin-top:6px}
.renameform{display:flex; align-items:center; gap:6px; flex:1; min-width:0}
.renameform input{flex:1; min-width:0; padding:6px 9px; font-size:15px; font-weight:600;
  border:1px solid var(--accent); border-radius:8px; background:var(--surface); color:var(--ink)}
.renameform input:focus{outline:none; box-shadow:0 0 0 3px var(--accent-soft)}

/* Immer zwei Zeilen je Person: oben der Name, unten links die Schichten
   und rechts der Betrag. So rutscht nie etwas unter den Namen. */
.paylist li{display:block; padding:9px 0}
.paylist .nm{display:block; font-weight:700; font-size:15px}
.paylist .det{display:flex; align-items:baseline; gap:12px; margin-top:1px}
.paylist .num{flex:1; min-width:0; font-size:13px; color:var(--ink-2)}
.paylist .pay{flex:none; margin-left:auto; font-weight:700; text-align:right; white-space:nowrap}
.paylist .slh{color:var(--ok); font-weight:700}
.paylist .fest{font-weight:600; font-size:12px; color:var(--ink-3)}
.paylist .pay.lo{color:var(--accent)}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";

/* ============================================================
   HIER EINTRAGEN
   Beide Werte stehen im Supabase-Projekt unter Project Settings,
   API. Der anon key ist öffentlich, das ist so vorgesehen:
   geschützt wird in der Datenbank, nicht in dieser Datei.
   ============================================================ */
const SUPABASE_URL = "https://ldtudrdedvgroxpinsew.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_UM3VJ8ya07n8WMKR5hc76Q_0xbaGla-";
/* ========================================================== */

const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const WD_SHORT = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const WD_LONG  = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const THEME_KEY = "rennbahn_theme";

/* Stand dieser Fassung — wird unten auf jeder Ansicht angezeigt */
const PATCH_AM  = "15.10.2026 um 18:10 Uhr";
const PATCH_VON = "D. Henrich";

/* Anmeldelink auswerten, bevor irgendetwas die Adresse aufräumt.
   Supabase liefert die Daten je nach Linkart im Anker oder als Parameter. */
const linkHash  = new URLSearchParams(location.hash.replace(/^#/, ""));
const linkQuery = new URLSearchParams(location.search);
const linkType    = linkHash.get("type") || linkQuery.get("type") || "";
const linkAccess  = linkHash.get("access_token");
const linkRefresh = linkHash.get("refresh_token");
const linkCode    = linkQuery.get("code");
const linkError   = linkHash.get("error_description") || linkQuery.get("error_description")
                 || linkHash.get("error") || linkQuery.get("error");
const SETUP_KEY = "rennbahn_setup_offen";
let linkHandled = false;   // der Anhang wird genau einmal ausgewertet

/* Projektadresse säubern: Leerzeichen, Schrägstriche am Ende und ein
   versehentlich mitkopierter Pfad fallen weg. Übrig bleibt der reine Host. */
function apiBase(u){
  let s = String(u || "").trim();
  if(!s) return "";
  if(!/^https?:\/\//i.test(s)) s = "https://" + s;
  try{ const p = new URL(s); return p.protocol + "//" + p.host; }
  catch(e){ return s.replace(/\/+$/, ""); }
}
const API_URL = apiBase(SUPABASE_URL);
const API_KEY = String(SUPABASE_ANON_KEY).trim();

/* detectSessionInUrl bleibt aus: die Auswertung macht consumeLink() selbst,
   sonst rennt der Start gegen eine noch nicht fertige Sitzung. */
const sb = window.supabase.createClient(API_URL, API_KEY, {
  auth: {detectSessionInUrl:false, persistSession:true, autoRefreshToken:true, flowType:"implicit"}
});

/* ============================================================
   Zustand
   ============================================================ */
let me = null;             // {id, name, role}
/* [{id, name, role, active, schedulable, can_lead, minijob, soll, pos}] —
   minijob, soll und pos sieht nur das Büro; die Liste ist stets sortiert */
let people = [];
let templates = {};        // {wochentag: [{label, start, end}]}
let config = {wage:0, wageSL:0, limit:0, limitOn:true};
let month = null;          // {ym, exists, published, days:{}, avail:{}}
let pending = null;
let dragData = null;

const ui = {
  screen: "boot",          // boot | auth | onboard | app | error
  bootMsg: "",
  monthKey: "",
  adminTab: "plan",
  empTab: "avail",
  authMode: "login",       // login | reset
  authError: "", authInfo: "", authDetail: "",
  formError: "", formInfo: "",
  selection: null,
  editingShift: null,
  renaming: null,            // Person, deren Name gerade geändert wird
  sheetOpen: false,
  checkOpen: true,
  jumpTo: null,
  sync: ""
};

/* ============================================================
   Kleine Helfer
   ============================================================ */
const esc = s => String(s == null ? "" : s)
  .replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => n.toLocaleString("de-DE",{minimumFractionDigits:2, maximumFractionDigits:2}) + " €";
const dec = (n, f) => n.toLocaleString("de-DE",
  {minimumFractionDigits: f === undefined ? 1 : f, maximumFractionDigits: f === undefined ? 1 : f});
const feldWert = (form, name) => {
  const el = form.querySelector('[name="' + name + '"]');
  return el ? el.value : "";
};
const toNum = v => { const x = parseFloat(String(v).replace(/\s/g,"").replace(",",".")); return isNaN(x) ? 0 : x; };

function monthKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function parseKey(k){ const p = k.split("-"); return {y:Number(p[0]), m:Number(p[1])-1}; }
function monthLabel(k){ const p = parseKey(k); return MONTHS[p.m] + " " + p.y; }
function daysInMonth(k){ const p = parseKey(k); return new Date(p.y, p.m+1, 0).getDate(); }
function weekdayOf(k, day){ const p = parseKey(k); return new Date(p.y, p.m, day).getDay(); }
function shiftMonth(k, delta){ const p = parseKey(k); return monthKey(new Date(p.y, p.m+delta, 1)); }
function isToday(k, day){ const t = new Date(); return monthKey(t) === k && t.getDate() === day; }

function hoursOf(sh){
  const a = sh.start.split(":").map(Number);
  const b = sh.end.split(":").map(Number);
  let mins = (b[0]*60 + b[1]) - (a[0]*60 + a[1]);
  if(mins <= 0) mins += 24*60;
  return mins/60;
}
const isAdmin = () => !!me && me.role === "admin";
const personName = id => { const p = people.find(x => x.id === id); return p ? p.name : "?"; };
const teamList = () => people.filter(p => p.active && p.schedulable);

/* ------------------------------------------------------------
   Reihenfolge der Teamliste

   Vier feste Gruppen, innerhalb einer Gruppe entscheidet die
   selbst gewählte Reihenfolge (sort_pos), und solange dort
   nichts hinterlegt ist, der Name.
   ------------------------------------------------------------ */
const GRUPPEN = ["Admin", "Festangestellte", "Minijob", "Nicht eingeplant"];

function personRank(p){
  if(p.role === "admin") return 0;            // Admin bleibt ganz oben
  if(!p.active || !p.schedulable) return 3;   // nicht eingeplant oder inaktiv ganz unten
  if(!p.minijob) return 1;                    // Festangestellte
  return 2;                                   // Minijob
}

/* 0 heißt „noch nie von Hand einsortiert“. Solche Leute stehen am Ende
   ihrer Gruppe, nach Namen sortiert — ein neues Konto wirft damit keine
   einmal festgelegte Reihenfolge durcheinander. */
const posOf = p => Number(p.pos) > 0 ? Number(p.pos) : Infinity;

function sortPeople(){
  people.sort((a, b) =>
    personRank(a) - personRank(b)
    || posOf(a) - posOf(b)
    || String(a.name).localeCompare(String(b.name), "de"));
}

/* Lückenlos durchnummerieren. Gibt die Personen zurück, deren
   Nummer sich dabei geändert hat — nur die müssen gespeichert
   werden. Beim ersten Verschieben ist das die ganze Liste. */
function renumberPeople(){
  const geaendert = [];
  people.forEach((p, i) => { if(p.pos !== i + 1){ p.pos = i + 1; geaendert.push(p); } });
  return geaendert;
}

async function writePos(liste){
  for(const p of liste) await write(sb.from("profiles").update({sort_pos:p.pos}).eq("id", p.id));
}

/* Person an die Stelle einer anderen ziehen. Nur innerhalb einer
   Gruppe, damit die Einteilung Admin / Fest / Minijob / außen
   nicht durch Ziehen umgangen wird. */
async function dropPerson(dragId, zielId, danach){
  const p = people.find(x => x.id === dragId);
  const q = people.find(x => x.id === zielId);
  if(!p || !q || p === q || personRank(p) !== personRank(q)) return;
  const dirty = new Set(renumberPeople());
  const liste = people.slice();
  liste.splice(liste.indexOf(p), 1);
  liste.splice(liste.indexOf(q) + (danach ? 1 : 0), 0, p);
  liste.forEach((x, i) => { if(x.pos !== i + 1){ x.pos = i + 1; dirty.add(x); } });
  people = liste;
  sortPeople();
  if(!dirty.size) return;
  render();
  await writePos([...dirty]);
}

/* Ruhetag, solange das Büro den Monat noch nicht angelegt hat */
const closedByTemplate = wd => !(templates[wd] && templates[wd].length);

function availOf(userId){
  if(!month.avail[userId]) month.avail[userId] = {off:[], confirmed:false};
  return month.avail[userId];
}
const isOff = (userId, day) => availOf(userId).off.indexOf(day) >= 0;
const andereWeg = day => teamList().filter(p => p.id !== me.id && isOff(p.id, day));
const hasLead = d => d.shifts.some(s => s.emp && s.sl);
const dayComplete = d => !d.closed && d.shifts.length > 0 && d.shifts.every(s => s.emp) && hasLead(d);
const canLead = id => { const p = people.find(x => x.id === id); return !!p && p.can_lead; };

/* Stunden, Lohn und die Lage zur jeweiligen Grenze einer Person.
   Minijob kennt eine Geldgrenze, Festanstellung ein Stundensoll. */
function payroll(userId){
  let shifts = 0, hNormal = 0, hSL = 0;
  Object.keys(month.days).forEach(key => month.days[key].shifts.forEach(s => {
    if(s.emp !== userId) return;
    shifts++;
    if(s.sl) hSL += hoursOf(s); else hNormal += hoursOf(s);
  }));
  const pay   = hNormal * config.wage + hSL * config.wageSL;
  const hours = hNormal + hSL;
  const p     = people.find(x => x.id === userId);
  const soll  = (p && !p.minijob) ? (Number(p.soll) || 0) : 0;
  return {
    shifts, hSL, hours, pay, soll,
    over:      config.limitOn && !!p && p.minijob && pay > config.limit,
    ueberSoll: soll > 0 && hours > soll + 0.001,
    unterSoll: soll > 0 && hours < soll - 0.001
  };
}

/* Zahlen für den Kopf der Planung */
function monthStats(){
  let open = 0, done = 0, slots = 0, filled = 0, conflicts = 0;
  Object.keys(month.days).forEach(key => {
    const d = month.days[key];
    if(d.closed) return;
    open++;
    if(dayComplete(d)) done++;
    d.shifts.forEach(s => {
      slots++;
      if(s.emp){ filled++; if(isOff(s.emp, Number(key))) conflicts++; }
    });
  });
  const team = teamList();
  return {
    open, done, slots, filled, conflicts,
    conf: team.filter(p => availOf(p.id).confirmed).length,
    total: team.length
  };
}

/* ============================================================
   Datenbank
   ============================================================ */
function setSync(kind){
  ui.sync = kind;
  const el = document.querySelector(".sync");
  if(!el) return;
  el.className = "sync " + (kind === "saving" || kind === "load" ? "saving" : kind === "bad" ? "bad" : "");
  el.textContent = kind === "load" ? "Lädt…"
    : kind === "saving" ? "Speichert…"
    : kind === "bad" ? "Nicht gespeichert" : "";
}

/* Jede Schreiboperation läuft hier durch */
async function write(builder){
  setSync("saving");
  const res = await builder;
  if(res && res.error){
    console.error(res.error);
    setSync("bad");
    ui.formError = "Nicht gespeichert: " + res.error.message;
    render();
    return false;
  }
  setSync("ok");
  return true;
}

async function loadProfile(){
  const {data: sess} = await sb.auth.getSession();
  if(!sess || !sess.session) return null;
  const uid = sess.session.user.id;
  const {data, error} = await sb.from("profiles").select("id,name,role,active").eq("id", uid).maybeSingle();
  if(error){ console.error(error); ui.bootMsg = "Profil konnte nicht geladen werden: " + error.message; return null; }
  return data;
}

async function loadAll(depth){
  const ym = ui.monthKey;
  const admin = isAdmin();

  const r = await Promise.all([
    sb.from("profiles").select("id,name,role,active,schedulable,can_lead,sort_pos").order("name"),
    sb.from("shift_templates").select("weekday,pos,label,starts,ends").order("weekday").order("pos"),
    sb.from("months").select("ym,published").eq("ym", ym).maybeSingle(),
    sb.from("days").select("ym,day,closed,note").eq("ym", ym),
    sb.from("shifts").select("id,ym,day,pos,label,starts,ends,assignee,is_lead").eq("ym", ym).order("pos"),
    sb.from("availability").select("user_id,off_days,confirmed").eq("ym", ym),
    admin ? sb.from("settings").select("wage,wage_lead,limit_amount,limit_on").eq("id", 1).maybeSingle()
          : Promise.resolve({data:null}),
    admin ? sb.from("payroll_flags").select("user_id,minijob,target_hours") : Promise.resolve({data:[]})
  ]);

  const bad = r.find(x => x && x.error);
  if(bad){ console.error(bad.error); ui.formError = "Laden fehlgeschlagen: " + bad.error.message; }

  const flags = {};
  (r[7].data || []).forEach(f => { flags[f.user_id] = f; });
  people = (r[0].data || []).map(p => ({
    id: p.id, name: p.name, role: p.role,
    active: p.active, schedulable: p.schedulable, can_lead: p.can_lead,
    minijob: flags[p.id] ? !!flags[p.id].minijob : true,
    soll:    flags[p.id] ? Number(flags[p.id].target_hours) || 0 : 0,
    pos:     Number(p.sort_pos) || 0
  }));
  sortPeople();

  templates = {};
  (r[1].data || []).forEach(t => {
    (templates[t.weekday] = templates[t.weekday] || []).push({label:t.label, start:t.starts, end:t.ends});
  });
  for(let wd = 0; wd < 7; wd++) templates[wd] = templates[wd] || [];

  if(r[6].data){
    config = {
      wage: Number(r[6].data.wage),
      wageSL: Number(r[6].data.wage_lead),
      limit: Number(r[6].data.limit_amount),
      limitOn: r[6].data.limit_on
    };
  }

  month = {ym, exists: !!r[2].data, published: r[2].data ? r[2].data.published : false, days:{}, avail:{}};
  (r[3].data || []).forEach(d => { month.days[d.day] = {closed:d.closed, comment:d.note, shifts:[]}; });
  (r[4].data || []).forEach(s => {
    const d = month.days[s.day];
    if(d) d.shifts.push({id:s.id, label:s.label, start:s.starts, end:s.ends, emp:s.assignee, sl:!!s.is_lead, pos:s.pos});
  });
  (r[5].data || []).forEach(a => {
    month.avail[a.user_id] = {off:(a.off_days || []).map(Number), confirmed:a.confirmed};
  });

  /* Büro öffnet einen noch nicht angelegten Monat: aus den Vorlagen aufbauen */
  if(admin && !month.exists && !depth){
    await createMonth(ym);
    return loadAll(1);
  }
}

async function createMonth(ym){
  setSync("saving");
  const n = daysInMonth(ym);
  const days = [], shifts = [];
  for(let d = 1; d <= n; d++){
    const tpl = templates[weekdayOf(ym, d)] || [];
    days.push({ym, day:d, closed: tpl.length === 0, note:""});
    tpl.forEach((t, i) => shifts.push({ym, day:d, pos:i, label:t.label, starts:t.start, ends:t.end}));
  }
  let res = await sb.from("months").insert({ym});
  if(res.error && res.error.code !== "23505"){ setSync("bad"); ui.formError = res.error.message; return; }
  res = await sb.from("days").upsert(days, {onConflict:"ym,day", ignoreDuplicates:true});
  if(res.error){ setSync("bad"); ui.formError = res.error.message; return; }
  if(shifts.length){
    res = await sb.from("shifts").insert(shifts);
    if(res.error){ setSync("bad"); ui.formError = res.error.message; return; }
  }
  setSync("ok");
}

async function reload(){
  setSync("load");
  await loadAll(0);
  setSync("");
  render();
}

/* ============================================================

function viewAuth(){

   Mitarbeiteransicht
   ============================================================ */
function viewStaff(){
  const tabs = [{id:"avail", label:"Meine Verfügbarkeit"}];
  if(month.published) tabs.push({id:"plan", label:"Dienstplan"});
  tabs.push({id:"account", label:"Mein Konto"});
  let tab = ui.empTab;
  if(tab === "plan" && !month.published) tab = "avail";
  const body = tab === "plan" ? staffPlan() : tab === "account" ? accountPanel() : staffAvail();
  return headerBar("Dienstplan", "Angemeldet als Mitarbeiter", tabs, tab)
    + `<main><div class="wrap">${body}${fussnote()}</div></main>`;
}

function staffAvail(){
  const k = ui.monthKey;
  const a = availOf(me.id);
  const n = daysInMonth(k);
  const locked = month.published;
  const shut = d => month.days[d] ? month.days[d].closed : closedByTemplate(weekdayOf(k, d));

  let zeilen = "";
  for(let d = 1; d <= n; d++){
    const wd = weekdayOf(k, d);
    if(wd === 1 && d > 1) zeilen += `<div class="wsep"></div>`;
    const closed = shut(d);
    const off = a.off.indexOf(d) >= 0;
    const weg = closed ? [] : andereWeg(d);
    const cls = ["drow", closed ? "zu" : "", off ? "off" : "", isToday(k, d) ? "heute" : ""]
      .filter(Boolean).join(" ");
    zeilen += `<button class="${cls}" ${closed || locked ? "disabled" : ""}
        data-act="toggleoff" data-day="${d}">
      <span class="dt">${WD_SHORT[wd]} <em>${d}.</em></span>
      <span class="wer ${weg.length ? "" : "frei"}">${
        closed ? "Ruhetag" : weg.length ? esc(weg.map(p => p.name).join(", ")) : "alle können"}</span>
      ${closed ? "" : `<span class="kreuz">×</span>`}
    </button>`;
  }
  const count = a.off.filter(d => !shut(d)).length;

  return monthBar()
    + (ui.formError ? `<div class="banner bad">${esc(ui.formError)}</div>` : "")
    + (locked ? `<div class="banner info">Der Dienstplan für diesen Monat ist freigegeben. Änderungen laufen jetzt übers Büro.</div>` : "")
    + (a.confirmed && !locked ? `<div class="banner ok">Bestätigt. Bis zur Freigabe kannst du noch etwas ändern.</div>` : "")
    + (locked ? "" : `<p class="hint">Tippe die Tage an, an denen du nicht verfügbar bist. In der Mitte steht, wer schon abgesagt hat.</p>`)
    + `<div class="days">${zeilen}</div>
       <div class="legend">
         <span><i style="background:var(--no-soft); border:1px solid var(--no-line)"></i>Ich kann nicht</span>
         <span><i style="background:var(--surface-2); border:1px dashed var(--line)"></i>Ruhetag</span>
       </div>`
    + (locked ? "" : `
      <div class="sticky-bar"><div class="sticky-in">
        <div class="grow small muted">${count === 0
          ? "Du kannst diesen Monat an allen Tagen"
          : count + (count === 1 ? " Tag" : " Tage") + " markiert"}</div>
        <button class="btn primary" data-act="confirm">${a.confirmed ? "Änderung bestätigen" : "Bestätigen"}</button>
      </div></div>`);
}

function staffPlan(){
  const k = ui.monthKey;
  const n = daysInMonth(k);
  let mine = 0, hrs = 0, out = "";
  for(let d = 1; d <= n; d++){
    const day = month.days[d];
    if(!day || day.closed) continue;
    const has = day.shifts.some(s => s.emp === me.id);
    if(has) day.shifts.forEach(s => { if(s.emp === me.id){ mine++; hrs += hoursOf(s); } });
    out += `<div class="plan-day ${has ? "mine" : ""}">
      <div class="hd">${WD_LONG[weekdayOf(k, d)]}, ${d}. ${MONTHS[parseKey(k).m]}</div>
      ${day.shifts.map(s => `<div class="sh"><b>${esc(s.label)}</b>
        <span class="${s.emp === me.id ? "me" : ""}">${s.emp ? esc(personName(s.emp)) + (s.sl ? " (SL)" : "") : "offen"} · ${s.start}–${s.end}</span>
      </div>`).join("")}
      ${day.comment ? `<div class="cm">${esc(day.comment)}</div>` : ""}
    </div>`;
  }
  return monthBar()
    + `<div class="banner ok">Deine Schichten: <b>${mine}</b> · rund <b>${dec(hrs)}</b> Stunden</div>`
    + out;
}

function accountPanel(){

    <form class="stack" data-form="account" style="max-width:360px">

function viewAdmin(){
  const tabs = [

    {id:"account", label:"Mein Konto"}
  ];
  const body = ui.adminTab === "team" ? adminTeam()
    : ui.adminTab === "settings" ? adminSettings()

    : adminPlan();
  return headerBar("Dienstplan", "Angemeldet als Administrator", tabs, ui.adminTab)
    + `<main><div class="wrap">${body}${fussnote()}</div></main>`;
}

function adminPlan(){
  const k = ui.monthKey;
  const st = monthStats();
  const n = daysInMonth(k);

  const actions = `
    <button class="btn" data-act="suggest">Vorschlag</button>
    <button class="btn" data-act="print">Drucken</button>
    <button class="btn ${month.published ? "" : "primary"}" data-act="publish">${month.published ? "Zurücknehmen" : "Freigeben"}</button>`;

  const checklist = `
  <details class="card fold checklist" ${ui.checkOpen ? "open" : ""}>
    <summary>
      <b>Eintragungen</b>
      <span class="muted small">${st.conf} von ${st.total} bestätigt</span>
      ${st.conf === st.total && st.total > 0 ? `<span class="pill done">vollständig</span>` : ""}
      <span class="caret"></span>
    </summary>
    <ul>${teamList().map(p => {
      const a = availOf(p.id);
      const cnt = a.off.filter(d => month.days[d] && !month.days[d].closed).length;
      return `<li class="${a.confirmed ? "yes" : ""}">${a.confirmed ? "✓" : "○"} ${esc(p.name)}${
        a.confirmed ? ` <span class="tiny" style="opacity:.7">${cnt}</span>` : ""}</li>`;
    }).join("") || `<li>Noch niemand im Team</li>`}</ul>
  </details>`;

  let strip = "", cols = "";
  for(let d = 1; d <= n; d++){
    const day = month.days[d];
    if(!day) continue;
    const filled = day.shifts.filter(s => s.emp).length;
    const cls = day.closed ? "rest" : dayComplete(day) ? "full" : filled ? "part" : "";
    strip += `<button class="ds ${cls}" data-act="goday" data-day="${d}" title="${WD_SHORT[weekdayOf(k, d)]} ${d}.">${d}</button>`;
    cols += dayColumn(d);
  }

  return monthBar(actions)
    + (ui.formError ? `<div class="banner bad">${esc(ui.formError)}</div>` : "")
    + (month.published ? `<div class="banner ok">Freigegeben — alle Mitarbeiter sehen den Plan in der App.</div>` : "")
    + (st.total === 0 ? `<div class="banner info">Noch wird niemand eingeplant. Lade unter <b>Team</b> Leute ein
        oder setze dort bei jemandem den Regler „Wird eingeplant“.</div>` : "")
    + checklist
    /* Nur der Fortschritt und der echte Planungsfehler. Wie die Stunden
       und Löhne stehen, zeigt die Übersicht unten. */
    + `<div class="planhead">
        <span class="pill ${st.done === st.open && st.open > 0 ? "done" : ""}"><b>${st.done}</b> von ${st.open} Tagen fertig</span>
        ${st.conflicts ? `<span class="pill warn"><b>${st.conflicts}</b> trotz Absage eingeteilt</span>` : ""}
       </div>`
    + `<div class="daystrip">${strip}</div>`
    + `<div class="board" id="board">${cols}</div>`
    + payPanel();
}

function dayColumn(d){
  const k = ui.monthKey;
  const day = month.days[d];
  const wd = weekdayOf(k, d);

  if(day.closed){
    return `<div class="col rest" data-col="${d}">
      <div class="colhead"><div class="d">${WD_SHORT[wd]} <span>${d}.</span></div></div>
      <div class="colbody">
        <div class="empty-note">Ruhetag</div>
        <button class="btn sm" data-act="openday" data-day="${d}">Tag öffnen</button>
      </div>
    </div>`;
  }

  const armed = !!ui.selection && ui.selection.day === d;

  const shifts = day.shifts.map(s => {
    if(ui.editingShift === s.id){
      return `<div class="slot-edit">
        <input data-edit="label" value="${esc(s.label)}" placeholder="Bezeichnung">
        <div class="two">
          <input data-edit="start" type="time" value="${s.start}">
          <input data-edit="end" type="time" value="${s.end}">
        </div>
        <div class="row">
          <button class="btn sm primary" data-act="saveshift" data-day="${d}" data-shift="${s.id}">Übernehmen</button>
          <div class="grow"></div>
          <button class="btn sm danger" data-act="delshift" data-day="${d}" data-shift="${s.id}">Löschen</button>
        </div>
      </div>`;
    }
    const conflict = s.emp && isOff(s.emp, d);
    return `<div class="slot ${s.emp ? "filled" : ""} ${armed && !s.emp ? "armed" : ""} ${conflict ? "conflict" : ""}"
        data-day="${d}" data-shift="${s.id}">
      <div class="slot-top">
        <span class="t">${esc(s.label)}</span>
        <span class="n">${s.start}–${s.end}</span>
      </div>
      <div class="slot-bot">
        ${s.emp ? `
          <span class="who-chip ${s.sl ? "is-sl" : ""} ${conflict ? "clash" : ""}" draggable="true"
            data-from="${d}:${s.id}" data-emp="${s.emp}"
            title="${conflict ? "Hat für diesen Tag abgesagt" : ""}">${esc(personName(s.emp))}</span>
          <button class="slbtn ${s.sl ? "on" : ""}" data-act="togglesl" data-day="${d}" data-shift="${s.id}"
            ${canLead(s.emp) ? "" : "disabled"} aria-pressed="${!!s.sl}"
            title="${canLead(s.emp) ? "Schichtleitung" : "Im Team nicht als Schichtleiter vorgesehen"}">SL</button>
          <button class="iconbtn x" data-act="clear" data-day="${d}" data-shift="${s.id}" aria-label="Freimachen">×</button>`
        : `
          <span class="free">${armed ? "antippen zum Einsetzen" : "frei"}</span>
          <button class="iconbtn" data-act="editshift" data-day="${d}" data-shift="${s.id}" aria-label="Schicht bearbeiten">✎</button>`}
      </div>
    </div>`;
  }).join("");

  const busy = day.shifts.filter(s => s.emp).map(s => s.emp);
  const team = teamList();
  const free = team.filter(p => !isOff(p.id, d));
  const away = team.filter(p => isOff(p.id, d));

  const chips = free.map(p => {
    const used = busy.indexOf(p.id) >= 0;
    const sel = armed && ui.selection.empId === p.id;
    const open = !availOf(p.id).confirmed;
    return `<button class="chip ${used ? "used" : ""} ${sel ? "sel" : ""} ${open ? "pending" : ""}"
      draggable="${!used}" data-emp="${p.id}" data-day="${d}" data-act="pick">${esc(p.name)}</button>`;
  }).join("");

  return `<div class="col ${dayComplete(day) ? "full" : ""}" data-col="${d}">
    <div class="colhead">
      <div class="d">${WD_SHORT[wd]} <span>${d}.</span></div>
      ${dayComplete(day) ? `<span class="check">✓</span>` : ""}
    </div>
    <div class="colbody">
      ${shifts || `<div class="empty-note">Keine Schichten</div>`}
      <button class="btn sm" data-act="addshift" data-day="${d}">+ Schicht</button>
      <div class="grouplbl">Kann an diesem Tag</div>
      <div class="chips">${chips || `<span class="empty-note">Niemand verfügbar</span>`}</div>
      ${away.length ? `<div class="tiny muted" style="margin-top:7px">Kann nicht: ${away.map(p => esc(p.name)).join(", ")}</div>` : ""}
      <div class="notewrap">
        <div class="grouplbl">Notiz</div>
        <textarea class="noteinput" data-note="${d}" rows="1" placeholder="Besonderheiten...">${esc(day.comment)}</textarea>
      </div>
    </div>
  </div>`;
}

function payPanel(){
  const zeilen = teamList().map(p => Object.assign({minijob:p.minijob, name:p.name}, payroll(p.id)));
  /* Minijob-Kräfte zuerst, denn nur bei ihnen ist die Geldgrenze zu beachten */
  const rows = zeilen.filter(r => r.minijob).sort((a, b) => b.pay - a.pay)
    .concat(zeilen.filter(r => !r.minijob).sort((a, b) => b.hours - a.hours));

  const einleitung = config.limitOn
    ? `Bei Minijob gilt eine Grenze von ${dec(config.limit,2)} € — bei ${dec(config.wage,2)} € pro Stunde
       und ${dec(config.wageSL,2)} € als Schichtleitung.`
    : `Die Verdienstgrenze wird derzeit nicht überwacht. ${dec(config.wage,2)} € pro Stunde,
       ${dec(config.wageSL,2)} € als Schichtleitung.`;

  /* Zeile 1: Name und gegebenenfalls ein Hinweis.
     Zeile 2: links Schichten und Stunden, rechts Betrag oder Soll. */
  const hinweis = r =>
      r.over      ? `<span class="flag">über Grenze</span>`
    : r.ueberSoll ? `<span class="flag">über Soll</span>`
    : r.unterSoll ? `<span class="flag lo">fehlen ${dec(r.soll - r.hours)} Std.</span>`
    : "";
  /* Bei Festanstellung mit Soll stehen die Stunden schon rechts —
     dann bleiben sie links weg, sonst wird die Zeile unnötig lang. */
  const stundenRechts = r => !r.minijob && r.soll > 0;
  const rechts = r =>
      r.minijob        ? `<span class="pay">${eur(r.pay)}</span>`
    : !stundenRechts(r) ? `<span class="pay fest">Festanstellung</span>`
    : `<span class="pay ${r.unterSoll ? "lo" : ""}">${dec(r.hours)} / ${dec(r.soll)} Std.</span>`;

  const links = r => {
    const teile = [r.shifts + (r.shifts === 1 ? " Schicht" : " Schichten")];
    if(!stundenRechts(r)) teile.push(dec(r.hours) + " Std.");
    if(r.hSL) teile.push(`<span class="slh" title="davon als Schichtleitung">${dec(r.hSL)} Std. SL</span>`);
    return teile.join(" · ");
  };

  const zeile = r => `<li class="${r.over || r.ueberSoll ? "over" : ""}">
      <span class="nm">${esc(r.name)}${hinweis(r)}</span>
      <span class="det">
        <span class="num">${links(r)}</span>
        ${rechts(r)}
      </span>
    </li>`;

  return `<div class="card panel" style="margin-top:16px">
    <h2>Stunden- und Schichtverteilung</h2>
    <p>Anzeige über verteilte Stunden und Schichten. ${einleitung}
       Bei Festanstellung zählen die Vertragsstunden aus dem Team.
       Diese Übersicht sieht nur der Administrator.</p>
    <ul class="list paylist">${
      rows.map(zeile).join("") || `<li class="muted">Noch niemand im Team.</li>`}</ul>
  </div>`;
}

/* Ein Schalter in der Personenkarte */
function teamSwitch(label, act, id, an, aus, titel){
  return `
    <label class="sw"${titel ? ` title="${esc(titel)}"` : ""}>
      <span class="sw-t">${esc(label)}</span>
      <input type="checkbox" data-act="${act}" data-emp="${id}" ${an ? "checked" : ""} ${aus ? "disabled" : ""}>
      <span class="sw-b"></span>
    </label>`;
}

/* Kopfzeile einer Personenkarte: Griff, Name, Kennzeichen, Zustand */
function personHeader(p, allein){
  const self  = p.id === me.id;
  const buero = p.role === "admin";
  const a     = availOf(p.id);

  const griff = allein ? "" : `<span class="grip" draggable="true" data-drag="person" data-emp="${p.id}"
      title="Ziehen, um die Reihenfolge innerhalb der Gruppe zu ändern">⠿</span>`;

  const name = ui.renaming === p.id
    ? `<form class="renameform" data-form="rename" data-emp="${p.id}">
         <input name="name" value="${esc(p.name)}" autocapitalize="words" aria-label="Name">
         <button class="btn sm primary" type="submit">Übernehmen</button>
         <button class="btn sm" type="button" data-act="cancelrename">Abbrechen</button>
       </form>`
    : `<span class="n">${esc(p.name)}</span>
       <button class="iconbtn" data-act="rename" data-emp="${p.id}"
         aria-label="Namen ändern" title="Namen ändern">✎</button>
       ${self ? `<span class="tiny muted">(du)</span>` : ""}
       ${buero ? `<span class="status">Admin</span>` : ""}
       ${!buero && p.can_lead ? `<span class="status" title="Kommt als Schichtleitung in Frage">SL</span>` : ""}`;

  /* Das Büro steht nicht im Dienstplan, dort wäre ein Zustand sinnlos */
  const zustand = buero && p.active ? ""
    : `<span class="status stat ${p.active && p.schedulable && a.confirmed ? "yes" : ""}">${
        !p.active ? "inaktiv" : !p.schedulable ? "nicht im Plan" : a.confirmed ? "bestätigt" : "offen"}</span>`;

  const wiederOeffnen = p.active && p.schedulable && a.confirmed
    ? `<button class="btn sm ropen" data-act="reopen" data-emp="${p.id}">Wieder öffnen</button>` : "";

  return `<div class="ph">${griff}${name}<span class="grow"></span>${zustand}${wiederOeffnen}</div>`;
}

/* Schalter einer Personenkarte. Beim Admin bleiben nur die beiden,
   die dort überhaupt eine Bedeutung haben. */
function personSwitches(p){
  const self = p.id === me.id;
  const rows = [
    teamSwitch("Aktiv", "toggleactive", p.id, p.active, self,
      self ? "Das eigene Konto lässt sich nicht deaktivieren" : ""),
    teamSwitch("Admin", "askrole", p.id, p.role === "admin", self,
      self ? "Den eigenen Adminzugang kannst du dir nicht entziehen" : "")
  ];

  if(p.role !== "admin"){
    rows.push(teamSwitch("Wird eingeplant", "toggleplan", p.id, p.schedulable, false,
      "Taucht in der Planung auf"));
    rows.push(teamSwitch("Schichtleiter", "togglelead", p.id, p.can_lead, false,
      "Kommt als Schichtleitung in Frage"));
    rows.push(teamSwitch("Minijob", "toggleminijob", p.id, p.minijob, !config.limitOn,
      config.limitOn ? "Verdienstgrenze wird für diese Person überwacht"
                     : "Die Grenzüberwachung ist in den Einstellungen abgeschaltet"));
    if(!p.minijob) rows.push(`
      <label class="swnum" title="Stunden, die diese Person im Monat erreichen soll">

        <span class="e">Std./Monat</span>
      </label>`);
  }
  return `<div class="pswitches">${rows.join("")}</div>`;
}

function buildPrint(){
  const k = ui.monthKey;
  const n = daysInMonth(k);
  let rows = "", first = true;

  for(let d = 1; d <= n; d++){
    const day = month.days[d];
    if(!day) continue;
    const wd = weekdayOf(k, d);
    const we = (wd === 5 || wd === 6) ? " pd-we" : "";
    const tag = WD_SHORT[wd] + " " + d + ".";
    const head = "pd-start" + (first ? " pd-first" : "") + we;
    first = false;

    if(day.closed || !day.shifts.length){
      rows += `<tr class="${head}"><td class="pd-day">${tag}</td>`
        + `<td class="pd-rest" colspan="2">${day.closed ? "Ruhetag" : "keine Schichten"}</td></tr>`;
      continue;
    }

    const span = day.shifts.length + (day.comment ? 1 : 0);
    day.shifts.forEach((sh, i) => {
      rows += `<tr class="${i === 0 ? head : we.trim()}">`
        + (i === 0 ? `<td class="pd-day" rowspan="${span}">${tag}</td>` : "")
        + `<td class="pd-time">${sh.start}–${sh.end}</td>`
        + `<td class="pd-who">${sh.emp
            ? esc(personName(sh.emp)) + (sh.sl ? `<span class="pd-sl">SL</span>` : "")
            : `<span class="pd-open">offen</span>`}</td></tr>`;
    });
    if(day.comment) rows += `<tr class="${we.trim()}"><td class="pd-note" colspan="2">${esc(day.comment)}</td></tr>`;
  }

  const sum = teamList().map(p => {
    const c = payroll(p.id).shifts;
    return c ? `<span>${esc(p.name)}: ${c}</span>` : "";
  }).join("");

  const html = `
    <h1>Dienstplan ${esc(monthLabel(k))}</h1>
    <p class="pd-sub">Bar Rennbahn Schwabing · Stand ${new Date().toLocaleDateString("de-DE")}</p>
    <table>
      <colgroup><col style="width:64px"><col style="width:106px"><col></colgroup>
      <thead><tr><th>Tag</th><th>Zeit</th><th>Wer</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="pd-sum"><b>Schichten je Person:</b> ${sum || "noch nichts verteilt"}
      <br>SL = Schichtleitung</div>`;

  document.getElementById("printRoot").innerHTML = `<div class="sheet">${html}</div>`;
  return html;
}

/* ============================================================
   Planungslogik
   ============================================================ */
async function assign(day, shiftId, userId){
  const d = month.days[day];
  if(!d) return;
  const sh = d.shifts.find(s => s.id === shiftId);
  if(!sh) return;

  /* Vertragsstunden: warnen, bevor jemand darüber hinaus eingeteilt wird */
  const p = people.find(x => x.id === userId);
  const pr = payroll(userId);
  if(p && !p.minijob && pr.soll > 0){
    const frei = d.shifts.filter(s => s.emp === userId && s.id !== shiftId)
      .reduce((sum, s) => sum + hoursOf(s), 0);
    const neuStd = pr.hours - frei + hoursOf(sh);
    if(neuStd > pr.soll + 0.001 && pr.hours <= pr.soll + 0.001){
      ask(p.name + " kommt damit auf " + dec(neuStd) + " von " + dec(pr.soll)
        + " Vertragsstunden. Trotzdem einteilen?", "Einteilen",
        () => setzeEin(day, shiftId, userId));
      return;
    }
  }
  await setzeEin(day, shiftId, userId);
}

async function setzeEin(day, shiftId, userId){
  const d = month.days[day];
  if(!d) return;
  const freed = d.shifts.filter(s => s.emp === userId && s.id !== shiftId);
  freed.forEach(s => { s.emp = null; s.sl = false; });
  const sh = d.shifts.find(s => s.id === shiftId);
  if(!sh) return;
  sh.emp = userId;

  /* Die erste Schicht des Tages ist im Normalfall die Schichtleitung.
     Nur wenn die Person dafür vorgesehen ist und noch niemand sonst leitet. */
  const erste = d.shifts.indexOf(sh) === 0;
  const schonGeleitet = d.shifts.some(s => s.sl && s.emp && s.id !== sh.id);
  if(erste && canLead(userId) && !schonGeleitet) sh.sl = true;
  if(!canLead(userId)) sh.sl = false;

  ui.selection = null;
  render();

  for(const s of freed) await write(sb.from("shifts").update({assignee:null, is_lead:false}).eq("id", s.id));
  await write(sb.from("shifts").update({assignee:userId, is_lead:sh.sl}).eq("id", shiftId));
}

/* Vorschlag in vier Durchgängen:
   1. Festangestellte führen die Schichten, bis ihre Vertragsstunden stehen
   2. Festangestellte füllen die Abendschichten, bis das Soll erreicht ist
   3. offene Schichtleitungen gehen an die übrigen geeigneten Leute
   4. der Rest wird gleichmäßig verteilt
   Niemand wird dabei über seine Grenze geschoben: Minijob über den Betrag,
   Festanstellung über die Vertragsstunden. */
async function suggestFill(){
  const team = teamList();
  const stand = {};
  team.forEach(p => { const pr = payroll(p.id); stand[p.id] = {pay:pr.pay, hours:pr.hours}; });
  const changes = [];

  const soll = p => (!p.minijob && Number(p.soll) > 0) ? Number(p.soll) : 0;
  const fest = team.filter(p => soll(p) > 0);
  const kosten = (sh, sl) => hoursOf(sh) * (sl ? config.wageSL : config.wage);
  const rueckstand = p => soll(p) - stand[p.id].hours;

  const frei = (p, tag) => !isOff(p.id, tag) && !month.days[tag].shifts.some(s => s.emp === p.id);
  const erlaubt = (p, sh, sl) => {
    if(p.minijob) return !(config.limitOn && stand[p.id].pay + kosten(sh, sl) > config.limit);
    return soll(p) === 0 || stand[p.id].hours + hoursOf(sh) <= soll(p) + 0.001;
  };
  /* Auslastung im Verhältnis zur eigenen Grenze, damit beide Gruppen vergleichbar sind */
  const last = p => p.minijob
    ? (config.limitOn && config.limit > 0 ? stand[p.id].pay / config.limit : stand[p.id].hours / 160)
    : (soll(p) > 0 ? stand[p.id].hours / soll(p) : stand[p.id].hours / 160);

  const setzen = (sh, p, sl) => {
    sh.emp = p.id;
    sh.sl = !!sl;
    stand[p.id].pay += kosten(sh, sl);
    stand[p.id].hours += hoursOf(sh);
    changes.push({id:sh.id, assignee:p.id, is_lead:sh.sl});
  };

  const tage = Object.keys(month.days).map(Number).sort((a, b) => a - b)
    .filter(t => !month.days[t].closed && month.days[t].shifts.length);

  /* 1 — Festangestellte als Schichtleitung, der größte Rückstand zuerst */
  tage.forEach(t => {
    const day = month.days[t];
    if(hasLead(day)) return;
    const sh = day.shifts.find(x => !x.emp);
    if(!sh) return;
    const pool = fest.filter(p => p.can_lead && rueckstand(p) > 0 && frei(p, t) && erlaubt(p, sh, true));
    if(!pool.length) return;
    pool.sort((a, b) => rueckstand(b) - rueckstand(a));
    setzen(sh, pool[0], true);
  });

  /* 2 — Festangestellte an den Abenden, danach notfalls auch früh */
  const fuellen = nurAbend => tage.forEach(t => {
    const day = month.days[t];
    day.shifts.forEach((sh, i) => {
      if(sh.emp) return;
      if(nurAbend && i === 0) return;
      const pool = fest.filter(p => rueckstand(p) > 0 && frei(p, t) && erlaubt(p, sh, false));
      if(!pool.length) return;
      pool.sort((a, b) => rueckstand(b) - rueckstand(a));
      const p = pool[0];
      setzen(sh, p, i === 0 && !hasLead(day) && p.can_lead);
    });
  });
  fuellen(true);
  fuellen(false);

  /* 3 — noch offene Schichtleitungen mit allen übrigen Geeigneten */
  tage.forEach(t => {
    const day = month.days[t];
    if(hasLead(day)) return;
    for(const sh of day.shifts){
      if(sh.emp) continue;
      const pool = team.filter(p => p.can_lead && frei(p, t) && erlaubt(p, sh, true));
      if(!pool.length) continue;
      pool.sort((a, b) => last(a) - last(b));
      setzen(sh, pool[0], true);
      break;
    }
  });

  /* 4 — restliche Schichten gleichmäßig */
  tage.forEach(t => {
    const day = month.days[t];
    day.shifts.forEach(sh => {
      if(sh.emp) return;
      const pool = team.filter(p => frei(p, t) && erlaubt(p, sh, false));
      if(!pool.length) return;                       // lieber offen lassen als eine Grenze reißen
      pool.sort((a, b) => last(a) - last(b));
      setzen(sh, pool[0], false);
    });
  });

  render();
  for(const c of changes) await write(
    sb.from("shifts").update({assignee:c.assignee, is_lead:c.is_lead}).eq("id", c.id));
}
