  <div class="card panel">
    <h2>${esc(monthLabel(ui.monthKey))}</h2>
    <p>Zuteilungen leeren behält Schichten und Eintragungen. Zurücksetzen baut den Monat neu aus den Vorlagen auf.</p>
    <div class="row">
      <button class="btn" data-act="clearmonth">Zuteilungen leeren</button>
      <button class="btn danger" data-act="resetmonth">Monat zurücksetzen</button>
    </div>
  </div>`;
}

/* ============================================================
   Zeiterfassung — Rechenkern

   Maßgeblich rechnet die Datenbank. Hier wird nur vorab angezeigt;
   nach jedem Schreiben übernimmt die Karte die zurückgegebenen Werte.
   Gerechnet wird in ganzen Minuten und in Berliner Zeit, nie in der
   Zeit des Geräts: ein Handy in Tokio soll dasselbe anzeigen.
   ============================================================ */
const ZE_FMT = new Intl.DateTimeFormat("en-GB", {timeZone:"Europe/Berlin", hourCycle:"h23",
  year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit"});

/* Abstand der Berliner Uhr zur Weltzeit in Minuten, zu einem Zeitpunkt */
function berOffsetMin(utcMs){
  const p = {};
  ZE_FMT.formatToParts(new Date(utcMs)).forEach(x => { p[x.type] = x.value; });
  return Math.round((Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - utcMs) / 60000);
}

/* Berliner Wanduhrzeit -> Weltzeit. Wie Postgres: die doppelte Stunde im
   Herbst gilt als Normalzeit, die ausgefallene im Frühjahr mit dem Versatz
   davor. Date.UTC rollt Monats- und Jahresende selbst weiter. */
function berWallToUtc(y, mo, d, h, mi){
  const wall = Date.UTC(y, mo - 1, d, h, mi);
  const sommer = berOffsetMin(wall - 120 * 60000) === 120;
  const winter = berOffsetMin(wall - 60 * 60000) === 60;
  return wall - (sommer && !winter ? 120 : 60) * 60000;
}

/* Brutto-Minuten einer Schicht. Ende <= Beginn heißt: Ende am Folgetag.
   Die Nacht der Zeitumstellung ist dadurch von selbst länger oder kürzer. */
function zeGross(ymd, starts, ends){
  const y = +ymd.slice(0, 4), mo = +ymd.slice(5, 7), d = +ymd.slice(8, 10);
  const s = zeMin(starts), e = zeMin(ends);
  const folgetag = e <= s;
  const t0 = berWallToUtc(y, mo, d, Math.floor(s / 60), s % 60);
  const t1 = berWallToUtc(y, mo, d + (folgetag ? 1 : 0), Math.floor(e / 60), e % 60);
  return Math.round((t1 - t0) / 60000);
}

/* „Heute“ in Berlin, als 2026-11-22 — nicht nach der Uhr des Geräts */
const berHeute = () => new Intl.DateTimeFormat("en-CA", {timeZone:"Europe/Berlin"}).format(new Date());

const zeMin = hm => { const p = String(hm).split(":"); return (+p[0] || 0) * 60 + (+p[1] || 0); };
const zeHM = m => (m < 0 ? "-" : "") + Math.floor(Math.abs(m) / 60) + ":" + String(Math.abs(m) % 60).padStart(2, "0");
/* Pflichtpause nach Arbeitszeitgesetz, bezogen auf die Brutto-Dauer:
   über 6:00 -> 30, über 9:00 -> 45. 17:00-02:00 sind genau 9:00, also 30. */
const zeReqBreak = g => g > 540 ? 45 : g > 360 ? 30 : 0;
/* Minuten -> Hundertstelstunden, kaufmännisch gerundet, ganzzahlig gerechnet */
const zeCenti = m => Math.floor((10 * m + 3) / 6);
const zeDez = m => dec(zeCenti(m) / 100, 2);

function zeCalc(ymd, starts, ends, brk, lead){
  if(!/^\d\d:\d\d$/.test(String(starts)) || !/^\d\d:\d\d$/.test(String(ends)))
    return {err:"Bitte Beginn und Ende eintragen.", gross:0, pause:0, net:0, sl:0, normal:0, req:0};
  const s = zeMin(starts), e = zeMin(ends);
  if(s === e) return {err:"Beginn und Ende sind gleich.", gross:0, pause:0, net:0, sl:0, normal:0, req:0};
  const gross = zeGross(ymd, starts, ends);
  const req = zeReqBreak(gross);
  const pause = Math.max(Number(brk) || 0, req);
  const net = gross - pause;
  const sl = Math.max(0, Math.min(Number(lead) || 0, Math.max(net, 0)));
  return {
    gross, req, pause, net, sl, normal: net - sl,
    folgetag: e <= s,
    uhr: ((e - s) + 1440) % 1440 || 1440,          // Dauer nach der Uhr, ohne Zeitumstellung
    lang: gross > 600,
    err: gross > 960 ? "Mehr als 16 Stunden — stimmen Beginn und Ende?"
       : net <= 0 ? "Die Pause ist länger als die Schicht." : ""
  };
}

/* „4:00“, „4.00“ oder „240“ -> Minuten */
function zeParseHM(v){
  const s = String(v == null ? "" : v).trim().replace(",", ":").replace(".", ":");
  if(!s) return 0;
  if(s.indexOf(":") < 0) return Math.max(0, Math.round(Number(s) || 0));
  const p = s.split(":");
  return Math.max(0, (Math.abs(Number(p[0])) || 0) * 60 + (Math.abs(Number(p[1])) || 0));
}

/* ============================================================
   Zeiterfassung — Daten aus dem geladenen Monat

   Das Büro trägt alle Schichten ein, Tag für Tag, mit den Zeiten aus
   dem Dienstplan als Vorschlag. Bestätigt wird jede Schicht einzeln
   (adm_ok) — damit ist sie für den Mitarbeiter sichtbar und
   freigegeben; was nicht bestätigt ist, sieht er gar nicht. Sind alle
   Schichten eines Tages bestätigt, gilt der Tag als erledigt; das
   rechnet die Oberfläche aus, gespeichert wird es nicht. Der
   Mitarbeiter kann eine Zeit korrigieren — dann ist die Schicht beim
   Büro wieder offen und markiert — und bestätigt nach Monatswechsel
   alle auf einmal. Danach ist die Schicht auch für das Büro zu.
   ============================================================ */
const ZE_SPALTEN = "id,user_id,work_date,ym,starts,ends,break_min,lead_min,gross_min,net_min," +
  "adm_ok,adm_ok_at,emp_ok,emp_ok_at,emp_changed,emp_orig,plan_starts,plan_ends,note,admin_note";

const zeiten  = () => (month && month.time) || {on:true, closed:false, rows:[], rates:null};
const zeZu    = () => !!zeiten().closed;
const zeTagNr = ymd => Number(String(ymd).slice(8, 10));
const zePad   = d => String(d).padStart(2, "0");
const zeYmd   = d => ui.monthKey + "-" + zePad(d);

const zeAmTag = d => zeiten().rows.filter(r => zeTagNr(r.work_date) === d);
const zeVon   = uid => zeiten().rows.filter(r => r.user_id === uid);
const zeZeile = id => zeiten().rows.find(r => r.id === id);

/* Ist der Monat vorbei? Nach Berliner Datum. Daran hängen die
   Sammelbestätigung des Mitarbeiters und der Monatsabschluss. */
function zeMonatVorbei(k){
  const p = parseKey(k);
  const y = p.m === 11 ? p.y + 1 : p.y;
  const m = p.m === 11 ? 1 : p.m + 2;
  return berHeute() >= y + "-" + zePad(m) + "-01";
}
const zeAbDatum = k => { const p = parseKey(k);
  return "01." + zePad(p.m === 11 ? 1 : p.m + 2) + "." + (p.m === 11 ? p.y + 1 : p.y); };

const zeDatum = iso => {
  const d = String(iso).slice(0, 10).split("-");
  return d.length === 3 ? d[2] + "." + d[1] + "." : String(iso).slice(0, 10);
};

/* Höchstens drei Namen aufzählen; eine Liste mit zehn Namen liest am
   Handy niemand, und sie macht aus einer Zeile einen Absatz. */
function zeWenige(namen){
  if(namen.length <= 3) return namen.join(", ");
  return namen.slice(0, 3).join(", ") + " und " + (namen.length - 3) + " weitere";
}

/* Die Schichten des Dienstplans an einem Tag, mit Person. Sie sind für
   das Büro nur ein Vorschlag: in die Zeiterfassung kommen sie erst,
   wenn es den Tag bestätigt oder die Schicht einzeln übernimmt. */
function zaPlan(d){
  if(!month.published) return [];
  const day = month.days[d];
  if(!day || day.closed) return [];
  return day.shifts.filter(s => s.emp)
    .map(s => ({emp:s.emp, starts:s.start, ends:s.end, lead:!!s.sl, label:s.label}));
}
const zaOffenePlan = d => {
  const da = zeAmTag(d);
  return zaPlan(d).filter(p => !da.some(e => e.user_id === p.emp));
};

/* Eine Plan-Schicht als Eintrag. null, wenn die Zeiten unmöglich sind —
   dann hat sich im Dienstplan etwas verstellt und das Büro muss hin. */
function zeAusPlan(d, p){
  const ymd = zeYmd(d);
  const c = zeCalc(ymd, p.starts, p.ends, 0, 0);
  if(c.err) return null;
  const per = people.find(x => x.id === p.emp);
  return {user_id:p.emp, work_date:ymd, starts:p.starts, ends:p.ends, break_min:c.pause,
    lead_min: p.lead && per && per.can_lead ? Math.max(0, c.net) : 0};
}

/* Zustand eines Tages. Gespeichert wird davon nichts: bestätigt werden
   die einzelnen Schichten, der Tag ist fertig, wenn alle seine Schichten
   bestätigt sind. */
function zaTagStand(d){
  const rows = zeAmTag(d).slice().sort((a, b) =>
    zeMin(a.starts) - zeMin(b.starts) || String(personName(a.user_id)).localeCompare(String(personName(b.user_id)), "de"));
  const plan = zaPlan(d);
  const geaendert = rows.filter(r => r.emp_changed);
  const ohneHaken = rows.filter(r => !r.adm_ok);
  return {
    d, ymd: zeYmd(d), wd: weekdayOf(ui.monthKey, d),
    rows, plan, offen: zaOffenePlan(d), geaendert, ohneHaken,
    noetig: rows.length > 0 || plan.length > 0,
    fertig: rows.length > 0 && !ohneHaken.length && !geaendert.length,
    netto: rows.reduce((s, r) => s + Number(r.net_min || 0), 0),
    sl: rows.reduce((s, r) => s + Number(r.lead_min || 0), 0)
  };
}

/* Was das Büro noch anfassen muss — dieselbe Zählung wie
   time_open_shifts in der Datenbank. Daran hängt der Abschluss. */
const zaOffeneSchichten = () => zeiten().rows.filter(r => !r.adm_ok || r.emp_changed);

/* Tage, an denen noch etwas zu tun ist: offene Schichten, oder ein
   Tag, an dem der Plan jemanden vorsieht und noch nichts steht. */
function zaOffeneTage(){
  const n = daysInMonth(ui.monthKey), heute = berHeute(), out = [];
  for(let d = 1; d <= n; d++){
    if(zeYmd(d) > heute) break;          // was noch nicht war, ist nicht offen
    const st = zaTagStand(d);
    if(st.noetig && !st.fertig) out.push(st);
  }
  return out;
}
/* Vorschläge aus dem Plan, die an einem sonst erledigten Tag liegen
   geblieben sind. Sie halten nichts auf, sollen aber sichtbar sein. */
function zaLiegenGeblieben(){
  const n = daysInMonth(ui.monthKey), heute = berHeute(), out = [];
  for(let d = 1; d <= n; d++){
    if(zeYmd(d) > heute) break;
    const st = zaTagStand(d);
    if(st.fertig && st.offen.length) out.push(st);
  }
  return out;
}
/* Bestätigte Schichten, die noch kein Mitarbeiter abgehakt hat. Das
   Büro bestätigt seine eigenen Schichten nicht noch einmal als
   Mitarbeiter — sonst bliebe der dritte Punkt ewig offen. */
function zaOffeneHaken(){
  return zeiten().rows.filter(r => {
    if(r.emp_ok || !r.adm_ok) return false;
    const p = people.find(x => x.id === r.user_id);
    return !p || p.role !== "admin";
  });
}
const zaFreigegeben = () => zeiten().rows.filter(r => r.adm_ok).length;

/* Wer gehört in diesen Monat: wer erfasste Zeiten hat oder im
   freigegebenen Plan eingeteilt ist. Bewusst NICHT teamList(): wer
   mitten im Monat deaktiviert oder zum Admin gemacht wird, hat die
   halbe Monatshälfte gearbeitet und muss weiter auftauchen. */
function zeScope(){
  const ids = {};
  zeiten().rows.forEach(r => { ids[r.user_id] = true; });
  if(month.published) Object.keys(month.days).forEach(key => {
    const day = month.days[key];
    if(day.closed) return;
    day.shifts.forEach(s => { if(s.emp) ids[s.emp] = true; });
  });
  return people.filter(p => ids[p.id]);
}

function zeSumme(uid){
  let normal = 0, sl = 0, tage = 0;
  zeVon(uid).forEach(r => {
    normal += Math.max(0, Number(r.net_min) - Number(r.lead_min));
    sl += Number(r.lead_min);
    tage++;
  });
  return {normal, sl, tage, netto: normal + sl};
}

/* Was hat der Mitarbeiter geändert? Entschieden wird durch Vergleich,
   nicht am Kennzeichen — ändert er etwas und stellt es zurück, soll
   keine Phantom-Änderung stehen bleiben. */
function zeDiffText(r){
  const o = r.emp_orig;
  if(!o) return "";
  const t = [];
  if((o.starts || "") !== (r.starts || "")) t.push("Beginn <b>" + (r.starts || "—") + "</b> statt " + (o.starts || "—"));
  if((o.ends || "") !== (r.ends || "")) t.push("Ende <b>" + (r.ends || "—") + "</b> statt " + (o.ends || "—"));
  if((Number(o.break_min) || 0) !== (Number(r.break_min) || 0))
    t.push("Pause <b>" + zeHM(r.break_min) + "</b> statt " + zeHM(Number(o.break_min) || 0));
  if((Number(o.lead_min) || 0) !== (Number(r.lead_min) || 0))
    t.push("Schichtleitung <b>" + zeHM(r.lead_min) + "</b> statt " + zeHM(Number(o.lead_min) || 0));
  return t.join(" · ");
}


/* ============================================================
   Zeiterfassung — Schreiben

   Die Datenbank rechnet, der Client zeigt an: jeder Schreibvorgang
   hängt .select() an und übernimmt danach die zurückgegebene Zeile.
   Gesperrte Änderungen treffen 0 Zeilen, ohne Fehler — deshalb wird
   ein leeres Ergebnis ausdrücklich als „gesperrt“ gemeldet.
   ============================================================ */
let zeBusy = false;

async function zeRun(builder){
  setSync("saving");
  let res;
  try{ res = await builder; }catch(err){ res = {error:{message:String(err && err.message || err)}}; }
  if(res && res.error){
    console.error(res.error);
    setSync("bad");
    return {ok:false, msg:res.error.message, data:null};
  }
  const rows = res && res.data ? [].concat(res.data) : null;
  if(rows && rows.length === 0){
    setSync("bad");
    return {ok:false, msg:"gesperrt — bitte lade die Seite neu", data:[]};
  }
  setSync("ok");
  return {ok:true, msg:"", data:rows};
}

/* Eine zurückgegebene Zeile in den geladenen Monat einsetzen */
function zeMerke(row){
  if(!row || !row.id) return;
  const t = zeiten();
  const i = t.rows.findIndex(r => r.id === row.id);
  if(i < 0) t.rows.push(row); else t.rows[i] = row;
}
const zeVergiss = id => { const t = zeiten(); t.rows = t.rows.filter(r => r.id !== id); };

/* ============================================================
   Zeiterfassung — der Editor einer Schicht

   Dieselbe Maske für Büro und Mitarbeiter. Das Büro darf zusätzlich
   die Person tauschen und die Schicht löschen; der Mitarbeiter sieht
   nur seine eigenen Zeiten.
   ============================================================ */
function zeFormAuf(id, d, vorschlag){
  const r = id ? zeZeile(id) : null;
  if(id && !r) return;                 // die Zeile ist weg — nichts aufmachen
  if(r){
    ui.zeForm = {id:r.id, d:zeTagNr(r.work_date), uid:r.user_id,
      starts:r.starts || "", ends:r.ends || "",
      brk:Number(r.break_min) || 0, lead:Number(r.lead_min) || 0,
      note:isAdmin() ? (r.admin_note || "") : (r.note || "")};
    ui.zeOpen = r.id;
  } else {
    /* Neue Schicht: aus dem Vorschlag, sonst aus der Standardschicht
       dieses Wochentags, sonst eine runde Abendschicht. */
    const tpl = (templates[weekdayOf(ui.monthKey, d)] || [])[0];
    const von = vorschlag ? vorschlag.starts : tpl ? tpl.start : "17:00";
    const bis = vorschlag ? vorschlag.ends : tpl ? tpl.end : "23:00";
    const c = zeCalc(zeYmd(d), von, bis, 0, 0);
    const wer = vorschlag ? vorschlag.emp : "";
    const per = people.find(x => x.id === wer);
    ui.zeForm = {id:null, d, uid:wer, starts:von, ends:bis, brk:c.pause,
      lead: vorschlag && vorschlag.lead && per && per.can_lead ? Math.max(0, c.net) : 0, note:""};
    ui.zeOpen = "neu";
  }
}

function zeCalcHtml(f){
  const c = zeCalc(zeYmd(f.d), f.starts, f.ends, f.brk, f.lead);
  if(c.err) return `<b>—</b><span class="ze-warn">${esc(c.err)}</span>`;
  const extra = [];
  if(c.gross !== c.uhr) extra.push("Zeitumstellung " + (c.gross > c.uhr ? "+" : "−")
    + zeHM(Math.abs(c.gross - c.uhr)) + " eingerechnet");
  if(c.folgetag) extra.push("Ende am Folgetag");
  return `<b>${zeHM(c.net)} Std</b> netto`
    + `<i>brutto ${zeHM(c.gross)} · Pause ${zeHM(c.pause)}`
    + (c.sl ? ` · normal ${zeHM(c.normal)} · Schichtleitung ${zeHM(c.sl)}` : "")
    + (extra.length ? " · " + esc(extra.join(" · ")) : "") + `</i>`
    + (c.lang ? `<span class="ze-warn">Über 10 Stunden — stimmt das?</span>` : "");
}

/* Die Hinweiszeile unter Pause und Schichtleitung. Sie muss sich
   mitändern, wenn die Zeiten geändert werden — sonst steht dort die
   alte Mindestpause. Unter 6:01 gibt es keine Pflichtpause und damit
   auch keinen Hinweis. */
function zeMinText(feld, c){
  if(feld === "brk")
    return c.req ? "Mindestens " + zeHM(c.req) + " (Schicht über " + (c.req === 45 ? "9" : "6")
      + " Std.). Verlängern geht, kürzen nicht — auch durch Eintippen." : "";
  return "Höchstens " + zeHM(Math.max(0, c.net)) + " — die reine Arbeitszeit.";
}

function zeEditHtml(){
  const f = ui.zeForm;
  if(!f) return "";
  const buero = isAdmin();
  const r = f.id ? zeZeile(f.id) : null;
  const per = people.find(q => q.id === f.uid) || {};
  const c = zeCalc(zeYmd(f.d), f.starts, f.ends, f.brk, f.lead);
  const netMax = Math.max(0, c.net);
  const zu = r && r.emp_ok;                      // bestätigt: für beide Seiten gesperrt

  /* Links Beschriftung und Hinweis untereinander, rechts die Stellfläche
     — beide Zeilen zusammen so hoch wie die Knöpfe daneben. */
  const spin = (feld, wert, schritt, min, titel, hinweis, extra) => `
    <div class="ze-line">
      <span class="ze-lt"><span class="lbl">${titel}</span>
        <span class="ze-mini" data-min="${feld}">${esc(hinweis)}</span></span>
      ${extra || ""}
      <div class="ze-spin">
        <button class="ze-spinb" data-act="zespin" data-feld="${feld}" data-d="-${schritt}"
          ${wert <= min ? "disabled" : ""} aria-label="weniger">–</button>
        <input class="ze-spinv" data-ze="${feld}" value="${zeHM(wert)}"
          inputmode="numeric" aria-label="${titel} in Stunden und Minuten">
        <button class="ze-spinb" data-act="zespin" data-feld="${feld}" data-d="${schritt}" aria-label="mehr">+</button>
      </div>
    </div>`;

  if(zu) return `<div class="ze-edit">
      <div class="ze-diff">${esc(buero
        ? personName(f.uid) + " hat diese Schicht bestätigt. Zum Ändern nimm die Bestätigung zurück — "
          + personName(f.uid) + " muss danach erneut bestätigen."
        : "Du hast diese Schicht bestätigt. Wenn etwas nicht stimmt, sag es dem Büro.")}</div>
      ${buero ? `<div class="ze-btns">
        <button class="btn" data-act="zezu">Schließen</button>
        <button class="btn primary" data-act="zeback" data-id="${f.id}">Bestätigung zurücknehmen</button>
      </div>` : `<div class="ze-btns"><button class="btn" data-act="zezu">Schließen</button></div>`}
    </div>`;

  const wahl = buero
    ? `<div><label class="lbl" for="ze-w">Wer</label>
         <select class="field" id="ze-w" data-ze="uid">
           ${f.uid ? "" : `<option value="">— bitte wählen —</option>`}
           ${people.filter(p => p.active || p.id === f.uid).map(p =>
             `<option value="${p.id}" ${p.id === f.uid ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
         </select></div>`
    : "";

  const diff = r && r.emp_changed && zeDiffText(r)
    ? `<div class="ze-diff">${buero ? esc(personName(f.uid)) + " hat geändert: " : "Von dir geändert: "}${zeDiffText(r)}</div>`
    : "";
  const anote = !buero && r && r.admin_note
    ? `<div class="ze-anote">Büro: ${esc(r.admin_note)}</div>` : "";
  const planzeile = r && r.plan_starts
    ? `<div class="tiny muted">Im Dienstplan: ${esc(r.plan_starts)}–${esc(r.plan_ends)}</div>`
    : r ? `<div class="tiny muted">Kein Dienstplan-Eintrag für diese Schicht.</div>` : "";

  return `<div class="ze-edit">
    ${planzeile}${diff}${anote}${wahl}
    <div class="ze-two">
      <div><label class="lbl" for="ze-s">Beginn</label>
        <input class="field ze-t" id="ze-s" type="time" data-ze="starts" value="${esc(f.starts)}"></div>
      <div><label class="lbl" for="ze-e">Ende</label>
        <input class="field ze-t" id="ze-e" type="time" data-ze="ends" value="${esc(f.ends)}"></div>
    </div>
    ${spin("brk", f.brk, 5, c.req, "Pause", zeMinText("brk", c), "")}
    ${per.can_lead ? spin("lead", Math.min(f.lead, netMax), 15, 0, "Davon Schichtleitung",
      zeMinText("lead", c), `<button class="btn sm" data-act="zeall">ganze Schicht</button>`) : ""}
    <div>
      <label class="lbl" for="ze-n">${buero ? "Anmerkung des Büros" : "Anmerkung (freiwillig)"}</label>
      <input class="field" id="ze-n" data-ze="note" value="${esc(f.note)}"
        placeholder="${buero ? "wird dem Mitarbeiter angezeigt" : "zum Beispiel: länger geblieben"}">
    </div>
    <div class="ze-calc">${zeCalcHtml(f)}</div>
    <div class="ze-btns">
      <button class="btn primary" data-act="zesave" ${c.err || (buero && !f.uid) ? "disabled" : ""}>✓ Bestätigen</button>
      ${buero && f.id
        ? `<button class="btn danger ze-x" data-act="zedel" data-id="${f.id}"
             aria-label="Schicht löschen" title="Schicht löschen">✕</button>`
        : `<button class="btn ze-x" data-act="zezu" aria-label="Abbrechen" title="Abbrechen">✕</button>`}
    </div>
  </div>`;
}

/* Nur den Rechenkasten, die Stepper und den Knopf neu schreiben — nicht
   die ganze Seite, sonst springt die Liste und der Fokus geht verloren. */
function zePatchEdit(){
  const f = ui.zeForm;
  if(!f) return;
  /* Zeiten geändert: die Mindestpause kann gestiegen sein (dann hebt sie
     die Datenbank ohnehin an), und die Schichtleitung muss auf die neue
     Arbeitszeit geklemmt werden — sonst lehnt der Riegel ab. */
  const c0 = zeCalc(zeYmd(f.d), f.starts, f.ends, f.brk, f.lead);
  if(f.brk < c0.req) f.brk = c0.req;
  if(f.lead > Math.max(0, c0.net)) f.lead = Math.max(0, c0.net);
  const c = zeCalc(zeYmd(f.d), f.starts, f.ends, f.brk, f.lead);
  const box = document.querySelector(".ze-edit .ze-calc");
  if(box) box.innerHTML = zeCalcHtml(f);
  document.querySelectorAll(".ze-edit .ze-mini").forEach(p => { p.textContent = zeMinText(p.dataset.min, c); });
  document.querySelectorAll(".ze-edit .ze-spinv").forEach(inp => {
    const feld = inp.dataset.ze;
    if(document.activeElement === inp) return;              // nicht beim Tippen dazwischenfahren
    inp.value = zeHM(feld === "brk" ? f.brk : Math.min(f.lead, Math.max(0, c.net)));
  });
  document.querySelectorAll(".ze-edit .ze-spinb").forEach(b => {
    const feld = b.dataset.feld, d = Number(b.dataset.d);
    b.disabled = d > 0 ? false : feld === "brk" ? f.brk <= c.req : f.lead <= 0;
  });
  const save = document.querySelector('.ze-edit [data-act="zesave"]');
  if(save) save.disabled = !!c.err || (isAdmin() && !f.uid);
}

/* Die zwei Haken nebeneinander, in der Reihenfolge, in der sie gesetzt
   werden: erst das Büro, dann der Mitarbeiter. Beim Büro ist der Haken
   ein Knopf, beim Mitarbeiter nur Anzeige — der bestätigt den Monat als
   Ganzes. */
function zeHaken(r, tippbar){
  const buero = r.adm_ok && !r.emp_changed;
  /* Eine bestätigte Schicht, die der Mitarbeiter abgehakt hat, lässt
     sich nicht einfach wieder aufmachen — dafür muss erst seine
     Bestätigung weg, und das steht im Editor. */
  const fest = buero && r.emp_ok;
  const titel = !r.adm_ok ? "Schicht bestätigen"
    : r.emp_changed ? "Der Mitarbeiter hat geändert — erneut bestätigen"
    : fest ? "Der Mitarbeiter hat abgehakt — zum Aufmachen zuerst seine Bestätigung zurücknehmen"
    : "Bestätigt — tippen macht die Schicht wieder auf";
  return `<span class="ze-ok2">
    ${tippbar
      ? `<button class="ze-h ${buero ? "is-on" : ""} ${r.emp_changed ? "is-chg" : ""}"
           data-act="zaok" data-id="${r.id}" ${fest ? "disabled" : ""}
           aria-label="${esc(titel)}" title="${esc(titel)}">✓</button>`
      : `<span class="ze-h ${buero ? "is-on" : ""}" title="Haken des Büros">✓</span>`}
    <span class="ze-h ${r.emp_ok ? "is-on" : ""}" title="Haken des Mitarbeiters">✓</span>
  </span>`;
}

/* Zweite Zeile einer Schicht: Stunden, Pause, Schichtleitung, Hinweise */
function zeUnten(r){
  const c = zeCalc(String(r.work_date), r.starts, r.ends, r.break_min, r.lead_min);
  const t = [zeHM(r.net_min) + " Std"];
  if(Number(r.break_min)) t.push("Pause " + zeHM(r.break_min));
  if(Number(r.lead_min)) t.push("SL " + zeHM(r.lead_min));
  if(Number(r.gross_min) !== c.uhr) t.push("Zeitumstellung");
  if(r.note) t.push(esc(r.note));
  return t.join(" · ");
}


/* ============================================================
   Mitarbeiter: Reiter Zeiterfassung
   ============================================================ */
function zeTageMitarbeiter(){
  return zeVon(me.id).slice().sort((a, b) => zeTagNr(a.work_date) - zeTagNr(b.work_date));
}

function zeDayHtml(r){
  const d = zeTagNr(r.work_date);
  const auf = ui.zeOpen === r.id;
  const c = zeCalc(String(r.work_date), r.starts, r.ends, r.break_min, r.lead_min);
  const cls = ["ze-day", r.emp_ok ? "is-adm" : "", r.emp_changed ? "is-chg" : "", auf ? "is-open" : ""]
    .filter(Boolean).join(" ");
  const gesperrt = zeZu();
  return `<div class="${cls}" data-id="${r.id}">
    <div class="ze-row">
      <button class="ze-head" data-act="zeday" data-id="${r.id}" ${gesperrt ? "disabled" : ""}>
        <span class="ze-dt">${WD_SHORT[weekdayOf(ui.monthKey, d)]} <em>${d}.</em></span>
        <span class="ze-tx">
          <span class="ze-times">${r.starts}–${r.ends}${c.folgetag ? " <small>+1</small>" : ""}</span>
          <span class="ze-sub">${zeUnten(r)}</span></span>
      </button>
      ${zeHaken(r, false)}
    </div>
    ${r.emp_changed && !auf && zeDiffText(r)
      ? `<div class="ze-diff" style="margin:0 11px 11px">Von dir geändert: ${zeDiffText(r)}
           — das Büro sieht es sich noch an.</div>` : ""}
    ${auf ? zeEditHtml() : ""}
  </div>`;
}

function staffTime(){
  const k = ui.monthKey;
  const rows = zeTageMitarbeiter();
  const s = zeSumme(me.id);
  const offen = rows.filter(r => !r.emp_ok);
  const vorbei = zeMonatVorbei(k);
  const geaendert = rows.filter(r => r.emp_changed);

  let banner = "";
  if(zeZu()) banner = `<div class="banner ok">Der Monat ist abgeschlossen. Hier ist nichts mehr zu tun.</div>`;
  else if(!rows.length)
    banner = `<div class="banner info">Für ${esc(monthLabel(k))} hat das Büro noch keine Schichten freigegeben.
      Sobald es das tut, stehen sie hier — und du prüfst und bestätigst sie.</div>`;
  else if(!offen.length)
    banner = `<div class="banner ok">Alles bestätigt. Danke — das Büro hat deine Zeiten.</div>`;
  else if(!vorbei)
    banner = `<div class="banner info">Bestätigen kannst du ab ${esc(zeAbDatum(k))}, wenn der Monat vorbei ist.
      Schau bis dahin ruhig schon mal drüber.</div>`;

  const kopf = `<div class="card panel ze-top">
    <div class="ze-state">${esc(
      zeZu() ? "Abgeschlossen."
      : !rows.length ? "Noch keine freigegebenen Schichten."
      : !offen.length ? "Alle " + rows.length + (rows.length === 1 ? " Schicht" : " Schichten") + " bestätigt."
      : offen.length + (offen.length === 1 ? " Schicht" : " Schichten") + " noch zu bestätigen.")}</div>
    <div class="ze-nums">
      <div class="ze-num"><span class="ze-nv">${zeHM(s.normal)}</span><span class="ze-nl">Normal</span></div>
      <div class="ze-num"><span class="ze-nv">${zeHM(s.sl)}</span><span class="ze-nl">Schichtleitung</span></div>
      <div class="ze-num"><span class="ze-nv">${zeHM(s.netto)}</span><span class="ze-nl">Gesamt</span></div>
    </div>
    <span class="pill ${rows.length && !offen.length ? "done" : ""}"><b>${rows.length - offen.length}</b>
      von ${rows.length} ${rows.length === 1 ? "Schicht" : "Schichten"} bestätigt</span>
  </div>`;

  const liste = rows.length
    ? `<div class="ze-days">${rows.map(zeDayHtml).join("")}</div>`
    : "";

  const fuss = !zeZu() && vorbei && offen.length
    ? `<div class="sticky-bar"><div class="sticky-in ze-fuss">
         <div class="grow small muted">${zeHM(s.netto)} Std${s.sl ? " · davon SL " + zeHM(s.sl) : ""}</div>
         <button class="btn primary" data-act="zemonat">✓ Monat bestätigen</button>
       </div></div>`
    : "";

  return monthBar()
    + (ui.formError ? `<div class="banner bad">${esc(ui.formError)}</div>` : "")
    + banner + kopf
    + (geaendert.length ? `<div class="ze-diff" style="margin-bottom:10px">Du hast <b>${geaendert.length}</b>
        ${geaendert.length === 1 ? "Schicht" : "Schichten"} geändert (${
          geaendert.map(r => zeTagNr(r.work_date) + ".").join(", ")}). Das Büro sieht sich das an und
        bestätigt erneut.</div>` : "")
    + liste
    + (rows.length ? `<p class="hint" style="margin-top:14px">Zwei Haken je Schicht: der <b>linke</b> ist der
        des Büros, der <b>rechte</b> deiner. Das Büro trägt die Schichten ein; stimmt eine Zeit nicht, tippe die
        Schicht an und ändere sie — sie geht dann beim Büro wieder auf. Zum Monatsende bestätigst du alles
        auf einmal. Eine Schicht zählt zu dem Tag, an dem sie <b>beginnt</b>.</p>` : "")
    + fuss;
}


/* ============================================================
   Büro: Reiter Zeiterfassung — Liste der Tage
   ============================================================ */
function zaListeHtml(){
  const k = ui.monthKey, n = daysInMonth(k), heute = berHeute();
  const tage = [];
  for(let d = 1; d <= n; d++){
    if(zeYmd(d) > heute) break;                // was noch nicht war, ist nicht zu bestätigen
    tage.push(zaTagStand(d));
  }
  if(!tage.length) return `<p class="empty-note">${esc(monthLabel(k))} hat noch nicht begonnen.</p>`;

  const offen = tage.filter(x => x.noetig && !x.fertig);
  const offeneSchichten = zaOffeneSchichten().length
    + offen.reduce((n, st) => n + st.offen.length, 0);
  const zeile = st => {
    const cls = ["za-row", !st.noetig ? "is-leer"
      : st.geaendert.length ? "is-chg" : st.fertig ? "is-adm" : "is-miss"].filter(Boolean).join(" ");
    const mitte = st.rows.length
      ? st.rows.length + (st.rows.length === 1 ? " Schicht" : " Schichten") + " · " + zeHM(st.netto) + " Std"
      : st.plan.length ? st.plan.length + (st.plan.length === 1 ? " Schicht" : " Schichten") + " im Plan"
      : "nichts geplant";
    /* Keine Namensvorschau: die zweite Zeile steht nur da, wenn es
       etwas zu tun gibt. */
    const unten = st.geaendert.length
      ? `<span class="za-dev">${st.geaendert.length === 1 ? "Eine Zeit" : st.geaendert.length + " Zeiten"}
          vom Mitarbeiter geändert</span>`
      : st.ohneHaken.length
        ? `<span class="za-dev">${st.ohneHaken.length} noch nicht bestätigt</span>`
      : st.offen.length
        ? `<span class="za-dev">${st.offen.length} aus dem Plan nicht übernommen</span>` : "";
    return `<div class="${cls}" data-d="${st.d}">
      <button class="za-rb" data-act="zaday" data-d="${st.d}">
        <span class="za-rt"><span class="za-rd">${WD_SHORT[st.wd]} ${st.d}.</span>
          <span class="za-rm">${mitte}</span></span>
        ${unten ? `<span class="za-rs">${unten}</span>` : ""}
      </button>
      <span class="za-mark ${st.noetig && st.fertig ? "is-ok" : ""}" aria-hidden="true">${
        !st.noetig ? "·" : st.fertig ? "✓" : "○"}</span>
    </div>`;
  };

  return `<div class="za-rows">${tage.map(zeile).join("")}</div>
    ${offeneSchichten && !zeZu() ? `<button class="btn ze-add primary" data-act="zaalle">✓ Alle
      ${offeneSchichten} offenen Schichten übernehmen und bestätigen</button>` : ""}
    <p class="hint" style="margin-top:14px">Tippe einen Tag an: dort stehen die Schichten so, wie sie im
      Dienstplan stehen. Du kannst Zeiten ändern, Personen tauschen und die Schichtleitung setzen. Bestätigt
      wird jede Schicht einzeln — damit sieht der Mitarbeiter sie und kann sie abhaken. Sind alle Schichten
      eines Tages bestätigt, ist der Tag fertig.</p>`;
}


/* ============================================================
   Büro: ein Tag
   ============================================================ */
/* Eine erfasste Schicht im Tag: Name, die zwei Haken, und ein Zeichen
   zum Auf- und Zuklappen. Die Zeiten stehen im Editor — in der
   zugeklappten Zeile wären sie nur Beiwerk. */
function zaRowHtml(r){
  const auf = ui.zeOpen === r.id;
  const cls = ["za-row is-schicht", r.emp_changed ? "is-chg" : r.adm_ok ? "is-adm" : "",
    auf ? "is-open" : ""].filter(Boolean).join(" ");
  return `<div class="${cls}" data-id="${r.id}">
      <button class="za-rb" data-act="zarow" data-id="${r.id}" ${zeZu() ? "disabled" : ""}>
        <span class="za-rm">${esc(personName(r.user_id))}</span>
        <span class="za-zu" aria-hidden="true">${auf ? "−" : "+"}</span>
      </button>
      ${zeHaken(r, !zeZu())}
    </div>
    ${r.emp_changed && zeDiffText(r)
      ? `<div class="ze-diff">${esc(personName(r.user_id))} hat geändert: ${zeDiffText(r)}
           <button class="btn sm" data-act="zetake" data-id="${r.id}"
             style="margin-left:6px">Übernehmen</button></div>` : ""}
    ${auf ? `<div class="ze-day is-open">${zeEditHtml()}</div>` : ""}`;
}

function zaTagHtml(d){
  const st = zaTagStand(d);
  const k = ui.monthKey;
  const neu = ui.zeOpen === "neu" && ui.zeForm && ui.zeForm.d === d;

  /* Vorschläge aus dem Plan: noch keine Schicht, nur ein Angebot.
     Tippen klappt den Editor auf, Bestätigen legt sie an. */
  const vor = st.offen.map(p => {
    const auf = ui.zeOpen === "neu" && ui.zeForm && ui.zeForm.d === d && ui.zeForm.uid === p.emp;
    return `<div class="za-row is-miss ${auf ? "is-open" : ""}">
      <button class="za-rb" data-act="zafromplan" data-d="${d}" data-emp="${p.emp}" ${zeZu() ? "disabled" : ""}>
        <span class="za-rt"><span class="za-rm">${esc(personName(p.emp))}</span>
          <span class="za-rs">${esc(p.starts)}–${esc(p.ends)}${p.lead ? " · Schichtleitung" : ""}
            · Vorschlag aus dem Dienstplan</span></span>
        <span class="za-zu" aria-hidden="true">${auf ? "−" : "+"}</span>
      </button>
    </div>${auf ? `<div class="ze-day is-open">${zeEditHtml()}</div>` : ""}`;
  }).join("");

  const neuLeer = neu && !st.offen.some(p => p.emp === ui.zeForm.uid);
  const liste = st.rows.map(zaRowHtml).join("") + vor;

  return `<button class="btn za-zurueck" data-act="zaback">‹ Alle Tage</button>
    <div class="za-phead">
      <div class="za-pnav">
        <button class="btn arrow" data-act="zadnav" data-d="${d - 1}" ${d <= 1 ? "disabled" : ""}
          aria-label="Vortag">‹</button>
        <div class="za-pname">${WD_SHORT[st.wd]} ${d}. ${esc(monthLabel(k).split(" ")[0])}</div>
        <button class="btn arrow" data-act="zadnav" data-d="${d + 1}"
          ${d >= daysInMonth(k) || zeYmd(d + 1) > berHeute() ? "disabled" : ""} aria-label="Nächster Tag">›</button>
      </div>
    </div>
    <div class="za-rows">${liste
      || `<p class="empty-note">An diesem Tag ist nichts eingetragen und nichts geplant.</p>`}</div>
    ${neuLeer ? `<div class="ze-day is-open">${zeEditHtml()}</div>`
      : zeZu() ? "" : `<button class="btn ze-add" data-act="zanew" data-d="${d}">+ Schicht hinzufügen</button>`}`;
}


/* ============================================================
   Büro: Abschluss, Stunden, CSV
   ============================================================ */
function zaSumHtml(){
  const leute = zeScope();
  const geschlossen = zeZu();
  const r = zeiten().rates;
  const satz = geschlossen && r ? r : {wage:config.wage, wage_lead:config.wageSL, limit_amount:config.limit};
  let gN = 0, gS = 0, gB = 0;

  const zeilen = leute.map(p => {
    const s = zeSumme(p.id);
    gN += s.normal; gS += s.sl;
    const plan = payroll(p.id);
    const brutto = (zeCenti(s.normal) / 100) * Number(satz.wage) + (zeCenti(s.sl) / 100) * Number(satz.wage_lead);
    gB += brutto;
    const ueber = config.limitOn && p.minijob && Number(satz.limit_amount) > 0 && brutto > Number(satz.limit_amount);
    const diff = (zeCenti(s.netto) / 100) - plan.hours;
    /* Wer nichts erfasst hat, bekommt eine kurze Zeile statt dreier
       Nullen und einer Betragsschätzung über 0,00 €. */
    if(!s.netto) return `<div class="za-s">
      <div class="za-sn"><b>${esc(p.name)}</b>
        <span class="tiny muted">nichts erfasst${plan.hours ? " · Plan war " + dec(plan.hours, 2) + " Std" : ""}</span></div>
    </div>`;
    return `<div class="za-s">
      <div class="za-sn"><b>${esc(p.name)}</b>
        <span class="tiny muted">${s.tage} ${s.tage === 1 ? "Schicht" : "Schichten"}</span>
        ${ueber ? `<span class="pill warn">über Grenze</span>` : ""}</div>
      <div class="za-sg">
        <span><b>${zeDez(s.normal)}</b>Normal</span>
        <span><b>${zeDez(s.sl)}</b>Schichtleitung</span>
        <span><b>${zeDez(s.netto)}</b>Stunden gesamt</span>
        <span class="is-geld"><b>${eur(brutto)}</b>Brutto${geschlossen ? "" : " (vorläufig)"}</span>
      </div>
      <span class="za-sx">${zeDez(s.normal)} × ${eur(Number(satz.wage))}
        ${s.sl ? "+ " + zeDez(s.sl) + " × " + eur(Number(satz.wage_lead)) + " " : ""}·
        Plan war ${dec(plan.hours, 2)} Std · Differenz ${diff >= 0 ? "+" : "−"}${dec(Math.abs(diff), 2)} Std</span>
    </div>`;
  }).join("");

  return `<div class="za-sum">${zeilen || `<p class="empty-note">Niemand in diesem Monat.</p>`}
    ${leute.length ? `<div class="za-total">Summe: ${zeDez(gN)} Normal · ${zeDez(gS)} Schichtleitung
      · ${dec((zeCenti(gN) + zeCenti(gS)) / 100, 2)} Stunden · ${eur(gB)} brutto</div>` : ""}</div>`;
}

function zaCloseHtml(){
  const k = ui.monthKey;
  const vorbei = zeMonatVorbei(k);
  const offeneS = zaOffeneSchichten();
  const liegen = zaLiegenGeblieben();
  const offeneHaken = zaOffeneHaken();
  const fehlen = [];
  offeneHaken.forEach(r => { const n = personName(r.user_id); if(fehlen.indexOf(n) < 0) fehlen.push(n); });
  const geschlossen = zeZu();
  /* Dasselbe Tor wie guard_time_month: nur offene Schichten halten auf.
     Nicht übernommene Vorschläge aus dem Plan nicht — die stehen als
     Hinweis darunter. */
  const bereit = vorbei && !offeneS.length;
  const tageVon = liste => zeWenige(liste.map(x => (x.d || zeTagNr(x.work_date)) + "."));

  const haken = (ok, text, sub) => `<li class="${ok ? "is-done" : ""}"><i>${ok ? "✓" : "○"}</i>
    <span style="color:inherit; font-size:14px">${esc(text)}${sub ? `<span>${esc(sub)}</span>` : ""}</span></li>`;

  return `<div class="card panel">
      <h2>Abschluss ${esc(monthLabel(k))}</h2>
      <ul class="za-chk">
        ${haken(vorbei, "Der Monat ist vorbei", vorbei ? "" : "geht ab " + zeAbDatum(k))}
        ${haken(!offeneS.length, "Alle Schichten vom Büro bestätigt",
          offeneS.length ? offeneS.length + " offen am " + tageVon(offeneS) : "")}
        ${haken(!offeneHaken.length, "Alle Schichten von den Mitarbeitern bestätigt",
          offeneHaken.length ? "es fehlen " + offeneHaken.length + " von " + zaFreigegeben()
            + " — " + zeWenige(fehlen) + " (hält den Abschluss nicht auf)" : "")}
      </ul>
      ${liegen.length ? `<p class="tiny muted" style="margin:-6px 0 14px">Dazu stehen
        <b>${liegen.reduce((n, x) => n + x.offen.length, 0)}</b> Schichten im Dienstplan, zu denen nichts
        erfasst ist (${esc(tageVon(liegen))}) — wer geplant war und nicht gearbeitet hat, hält den Abschluss
        nicht auf. Diese Schichten zählen dann aber auch nicht mit.</p>` : ""}
      ${geschlossen
        ? `<div class="banner ok">Abgeschlossen${zeiten().closed_at ? " am " + zeDatum(zeiten().closed_at) : ""}.
             Niemand kann die Zeiten mehr ändern.</div>

/* ============================================================
   Zeiterfassung — CSV

   Semikolon, CRLF, UTF-8 mit Signatur, Dezimalkomma: so öffnet
   deutsches Excel die Datei ohne Nachfrage. Der Monat steht als zwei
   Zahlenspalten, sonst macht Excel daraus ein Datum.
   ============================================================ */
function csvFeld(v){
  let s = v === null || v === undefined ? "" : String(v);
  if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;          // keine Formel aus einem Namen
  return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const csvZeile = a => a.map(csvFeld).join(";");

function csvLaden(name, text){
  const blob = new Blob(["﻿" + text], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function zeCsvSummen(){
  const p = parseKey(ui.monthKey);
  const r = zeiten().rates;
  const satz = zeZu() && r ? r : {wage:config.wage, wage_lead:config.wageSL};
  const kopf = ["Jahr", "Monat", "Name", "Schichten", "Stunden normal", "Stunden Schichtleitung",
    "Stunden gesamt", "Minuten normal", "Minuten Schichtleitung",
    "Satz normal", "Satz Schichtleitung", "Brutto", "Alle Schichten bestätigt"];
  const zeilen = zeScope().slice()
    .sort((a, b) => String(a.name).localeCompare(String(b.name), "de"))
    .map(x => {
      const s = zeSumme(x.id);
      const offen = zeVon(x.id).filter(r => !r.emp_ok).length;
      const brutto = (zeCenti(s.normal) / 100) * Number(satz.wage)
                   + (zeCenti(s.sl) / 100) * Number(satz.wage_lead);
      return csvZeile([p.y, p.m + 1, x.name, s.tage, zeDez(s.normal), zeDez(s.sl),
        dec((zeCenti(s.normal) + zeCenti(s.sl)) / 100, 2), s.normal, s.sl,
        dec(Number(satz.wage), 2), dec(Number(satz.wage_lead), 2), dec(brutto, 2),
        s.tage === 0 ? "" : offen ? "nein (" + offen + " offen)" : "ja"]);
    });
  return [csvZeile(kopf)].concat(zeilen).join("\r\n") + "\r\n";
}

function zeCsvTage(){
  const p = parseKey(ui.monthKey);
  const kopf = ["Datum", "Wochentag", "Name", "Beginn", "Ende", "Ende am Folgetag", "Pause (Min)",
    "Netto (Std)", "davon Schichtleitung (Std)", "davon normal (Std)", "Vom Büro bestätigt",
    "Vom Mitarbeiter bestätigt", "Mitarbeiter hat geändert", "Beginn vorher", "Ende vorher",
    "Plan Beginn", "Plan Ende", "Anmerkung"];
  const nach = zeiten().rows.slice().sort((a, b) =>
    String(personName(a.user_id)).localeCompare(String(personName(b.user_id)), "de")
    || zeTagNr(a.work_date) - zeTagNr(b.work_date));
  const zeilen = nach.map(r => {
    const d = zeTagNr(r.work_date);
    const o = r.emp_changed ? r.emp_orig : null;
    const anm = [r.note, r.admin_note].filter(Boolean).join(" | ");
    return csvZeile([
      zePad(d) + "." + zePad(p.m + 1) + "." + p.y,
      WD_SHORT[weekdayOf(ui.monthKey, d)], personName(r.user_id),
      r.starts, r.ends, zeMin(r.ends) <= zeMin(r.starts) ? "ja" : "nein",
      r.break_min, zeDez(r.net_min), zeDez(r.lead_min), zeDez(Math.max(0, r.net_min - r.lead_min)),
      r.adm_ok ? "ja" : "nein", r.emp_ok ? "ja" : "nein", r.emp_changed ? "ja" : "nein",
      o ? (o.starts || "") : "", o ? (o.ends || "") : "",
      r.plan_starts || "", r.plan_ends || "", anm
    ]);
  });
  return [csvZeile(kopf)].concat(zeilen).join("\r\n") + "\r\n";
}


/* ============================================================
   Zeiterfassung — Schreiben, angestoßen durch Tippen
   ============================================================ */
async function zeSpeichern(){
  if(zeBusy || !ui.zeForm) return;
  const f = ui.zeForm;
  const c = zeCalc(zeYmd(f.d), f.starts, f.ends, f.brk, f.lead);
  if(c.err){ ui.formError = c.err; render(); return; }
  const buero = isAdmin();
  if(buero && !f.uid){ ui.formError = "Bitte wähle, wer die Schicht gearbeitet hat."; render(); return; }

  const nutz = {starts:f.starts, ends:f.ends, break_min:c.pause, lead_min:c.sl};
  /* Wer die Schicht im Editor bestätigt, bestätigt sie auch als Schicht:
     ein Tipp, nicht zwei. */
  if(buero){ nutz.admin_note = f.note; nutz.adm_ok = true; } else nutz.note = f.note;

  zeBusy = true;
  const res = f.id
    ? await zeRun(sb.from("time_entries")
        .update(buero ? Object.assign({user_id:f.uid}, nutz) : nutz).eq("id", f.id).select(ZE_SPALTEN))
    : await zeRun(sb.from("time_entries")
        .insert(Object.assign({user_id:f.uid, work_date:zeYmd(f.d)}, nutz)).select(ZE_SPALTEN));
  zeBusy = false;
  if(!res.ok){ ui.formError = "Nicht gespeichert: " + res.msg; render(); return; }
  if(res.data && res.data[0]) zeMerke(res.data[0]);
  ui.zeOpen = null; ui.zeForm = null; ui.formError = "";
  render();
}

/* Den Haken des Büros an einer Schicht umlegen. Nicht bestätigt oder
   vom Mitarbeiter geändert -> bestätigen; bestätigt -> zurücknehmen.
   Zurücknehmen geht nur, solange der Mitarbeiter nicht abgehakt hat —
   die Oberfläche sperrt den Knopf dann, die Datenbank auch. */
async function zaHaken(id){
  if(zeBusy) return;
  const r = zeZeile(id);
  if(!r) return;
  const ziel = !(r.adm_ok && !r.emp_changed);
  zeBusy = true;
  const res = await zeRun(sb.from("time_entries").update({adm_ok:ziel}).eq("id", id).select(ZE_SPALTEN));
  zeBusy = false;
  if(!res.ok){ ui.formError = "Nicht gespeichert: " + res.msg; render(); return; }
  if(res.data && res.data[0]) zeMerke(res.data[0]);
  render();
}

/* Alles auf einmal: die liegen gebliebenen Vorschläge aus dem Plan
   übernehmen und jede offene Schicht bestätigen. Für einen Monat, in
   dem der Plan gestimmt hat, ist das der Normalfall — Schicht für
   Schicht tippen will niemand. */
async function zaAlleSchichten(){
  if(zeBusy) return;
  const k = ui.monthKey, n = daysInMonth(k), heute = berHeute();
  const neu = [], weg = [];
  for(let d = 1; d <= n; d++){
    if(zeYmd(d) > heute) break;
    zaOffenePlan(d).forEach(p => {
      const z = zeAusPlan(d, p);
      if(z) neu.push(Object.assign(z, {adm_ok:true}));
      else weg.push(d + ". " + personName(p.emp));
    });
  }
  zeBusy = true;
  if(neu.length){
    const res = await zeRun(sb.from("time_entries").insert(neu).select(ZE_SPALTEN));
    if(!res.ok){ zeBusy = false; ui.formError = "Vorschläge nicht übernommen: " + res.msg; render(); return; }
  }
  /* Zwei Durchgänge statt einer Oder-Bedingung: noch nicht bestätigt,
     und erneut zu bestätigen nach einer Änderung des Mitarbeiters. */
  for(const filter of [["adm_ok", false], ["emp_changed", true]]){
    const res = await zeRun(sb.from("time_entries").update({adm_ok:true})
      .eq("ym", k).eq(filter[0], filter[1]).select("id"));
    if(!res.ok && res.data === null){ zeBusy = false; ui.formError = "Nicht bestätigt: " + res.msg; render(); return; }
  }
  zeBusy = false;
  ui.formError = weg.length ? "Nicht übernommen (unmögliche Zeiten im Dienstplan): " + zeWenige(weg) : "";
  await reload();
}


/* ============================================================
   Zeiterfassung — Klicks

   Steht vor dem großen switch in handleClick(): alle Aktionen mit den
   Präfixen ze… und za… werden hier behandelt. Was hier nichts findet,
   läuft unverändert weiter.
   ============================================================ */
async function zeClick(act, el){
  const k = ui.monthKey;
  const id = el.dataset.id;
  const tagN = Number(el.dataset.d);
  /* Eine Meldung gehört zur letzten Handlung: beim nächsten Tipp ist sie weg */
  ui.formError = ""; ui.zeFehler = "";

  switch(act){

    /* ---- gemeinsamer Editor ---- */
    case "zeday":
    case "zarow": {
      if(ui.zeOpen === id){ ui.zeOpen = null; ui.zeForm = null; }
      else zeFormAuf(id);
      render();
      if(ui.zeOpen){
        const box = document.querySelector(".ze-edit");
        if(box && box.scrollIntoView) box.scrollIntoView({block:"nearest"});
      }
      return true;
    }
    case "zezu": ui.zeOpen = null; ui.zeForm = null; render(); return true;
    case "zanew": zeFormAuf(null, tagN, null); render(); return true;
    case "zafromplan": {
      /* Derselbe Tipp klappt wieder zu — sonst käme man aus dem Editor
         eines Vorschlags nur über einen Umweg heraus. */
      if(ui.zeOpen === "neu" && ui.zeForm && ui.zeForm.d === tagN
         && ui.zeForm.uid === el.dataset.emp && !ui.zeForm.id){
        ui.zeOpen = null; ui.zeForm = null; render(); return true;
      }
      const p = zaPlan(tagN).find(x => x.emp === el.dataset.emp);
      if(p) zeFormAuf(null, tagN, p);
      render();
      return true;
    }

    case "zespin": {
      if(!ui.zeForm) return true;
      const f = el.dataset.feld, dd = Number(el.dataset.d);
      const c = zeCalc(zeYmd(ui.zeForm.d), ui.zeForm.starts, ui.zeForm.ends, ui.zeForm.brk, ui.zeForm.lead);
      if(f === "brk") ui.zeForm.brk = Math.max(c.req, Math.min(600, (Number(ui.zeForm.brk) || 0) + dd));
      else ui.zeForm.lead = Math.max(0, Math.min(Math.max(0, c.net), (Number(ui.zeForm.lead) || 0) + dd));
      zePatchEdit();
      return true;
    }
    case "zeall": {
      if(!ui.zeForm) return true;
      const c = zeCalc(zeYmd(ui.zeForm.d), ui.zeForm.starts, ui.zeForm.ends, ui.zeForm.brk, 0);
      ui.zeForm.lead = Math.max(0, c.net);
      zePatchEdit();
      return true;
    }
    case "zesave": await zeSpeichern(); return true;

    case "zedel": {
      const r = zeZeile(id);
      if(!r) return true;
      ask("Die Schicht von " + personName(r.user_id) + " am " + zeTagNr(r.work_date)
        + ". wirklich löschen? Steht sie im Dienstplan, schlägt die App sie danach wieder vor.",
        "Löschen", async () => {
          const res = await zeRun(sb.from("time_entries").delete().eq("id", r.id).select("id"));
          if(!res.ok){ ui.formError = "Nicht gelöscht: " + res.msg; render(); return; }
          zeVergiss(r.id);
          ui.zeOpen = null; ui.zeForm = null;
          render();
        });
      return true;
    }

    /* ---- Büro: Änderung des Mitarbeiters annehmen, Bestätigung zurücknehmen ---- */
    case "zetake": {
      const res = await zeRun(sb.from("time_entries").update({emp_changed:false})
        .eq("id", id).select(ZE_SPALTEN));
      if(!res.ok){ ui.formError = "Nicht übernommen: " + res.msg; render(); return true; }
      if(res.data && res.data[0]) zeMerke(res.data[0]);
      render();
      return true;
    }
    case "zeback": {
      const r = zeZeile(id);
      if(!r) return true;
      ask("Die Bestätigung von " + personName(r.user_id) + " für den " + zeTagNr(r.work_date)
        + ". zurücknehmen? Du kannst die Zeit danach ändern, " + personName(r.user_id)
        + " muss sie erneut bestätigen.", "Zurücknehmen", async () => {
          const res = await zeRun(sb.from("time_entries").update({emp_ok:false})
            .eq("id", r.id).select(ZE_SPALTEN));
          if(!res.ok){ ui.formError = "Nicht zurückgenommen: " + res.msg; render(); return; }
          if(res.data && res.data[0]) zeMerke(res.data[0]);
          zeFormAuf(r.id);
          render();
        });
      return true;
    }

    /* ---- Büro: Tage ---- */
    case "zastep":
      ui.zaStep = el.dataset.step; ui.zaDay = null;
      ui.zeOpen = null; ui.zeForm = null; render(); return true;
    case "zaday":
      ui.zaDay = tagN; ui.zaStep = "tage";
      ui.zeOpen = null; ui.zeForm = null; render(); window.scrollTo(0, 0); return true;
    case "zaback":
      ui.zaDay = null; ui.zeOpen = null; ui.zeForm = null; render(); return true;
    case "zadnav":
      ui.zaDay = Math.max(1, Math.min(daysInMonth(k), tagN));
      ui.zeOpen = null; ui.zeForm = null; render(); window.scrollTo(0, 0); return true;
    case "zaok": await zaHaken(id); return true;
    case "zaalle": {
      const offeneS = zaOffeneSchichten().length;
      let vor = 0;
      const n = daysInMonth(k), heute = berHeute();
      for(let d = 1; d <= n && zeYmd(d) <= heute; d++) vor += zaOffenePlan(d).length;
      ask("Alle offenen Schichten bestätigen"
        + (vor ? " und dabei " + vor + (vor === 1 ? " Schicht" : " Schichten") + " aus dem Dienstplan übernehmen" : "")
        + "? Danach sehen die Mitarbeiter ihre Schichten und können sie abhaken. Einzelne Schichten kannst du "
        + "jederzeit wieder aufmachen.", "Alle bestätigen", zaAlleSchichten);
      return true;
    }

    /* ---- Mitarbeiter: Monat bestätigen ---- */
    case "zemonat": {
      const s = zeSumme(me.id);
      const offen = zeVon(me.id).filter(r => !r.emp_ok);
      ask("Du bestätigst " + offen.length + (offen.length === 1 ? " Schicht" : " Schichten")
        + " für " + monthLabel(k) + ": zusammen " + zeHM(s.netto) + " Std, davon " + zeHM(s.sl)
        + " Schichtleitung. Danach kannst du nichts mehr ändern — nur das Büro kann die Bestätigung "
        + "wieder aufheben.", "Monat bestätigen", async () => {
          const res = await zeRun(sb.from("time_entries").update({emp_ok:true})
            .eq("ym", k).eq("user_id", me.id).eq("emp_ok", false).select(ZE_SPALTEN));
          if(!res.ok){ ui.formError = "Nicht bestätigt: " + res.msg; render(); return; }
          (res.data || []).forEach(zeMerke);
          ui.zeOpen = null; ui.zeForm = null;
          render();
        });
      return true;
    }

    /* ---- Büro: Monat abschließen, wieder öffnen, CSV ---- */
    case "zaclose": {
      const offeneHaken = zaOffeneHaken();
      const liegen = zaLiegenGeblieben().reduce((n, x) => n + x.offen.length, 0);
      ask(monthLabel(k) + " abschließen? Danach kann niemand mehr Zeiten ändern — auch du nicht, bis du "
        + "den Monat wieder öffnest. Die Lohnsätze werden dabei festgeschrieben."
        + (offeneHaken.length ? " Es fehlen noch " + offeneHaken.length + " Bestätigungen von Mitarbeitern; "
            + "die Stunden stehen trotzdem fest und der Punkt bleibt sichtbar offen." : "")
        + (liegen ? " Außerdem sind " + liegen + " geplante Schichten nicht erfasst — die zählen nicht mit." : ""),
        "Abschließen", async () => {
          const res = await zeRun(sb.from("time_months")
            .upsert({ym:k, closed:true}, {onConflict:"ym"}).select("ym,closed"));
          if(!res.ok){ ui.formError = "Nicht abgeschlossen: " + res.msg; render(); return; }
          await reload();
        });
      return true;
    }
    case "zareopen":
      ask(monthLabel(k) + " wieder öffnen? Eine schon an die Steuerberatung gegebene CSV-Datei passt "
        + "danach vielleicht nicht mehr zu den Zeiten.", "Wieder öffnen", async () => {
          const res = await zeRun(sb.from("time_months").update({closed:false}).eq("ym", k).select("ym,closed"));
          if(!res.ok){ ui.formError = "Nicht geöffnet: " + res.msg; render(); return; }
          await reload();
        });
      return true;
    case "zacsv": {
      /* ohne await, sonst zählt der Browser den Download nicht mehr als Benutzeraktion */
      const name = "Rennbahn_Zeiten_" + k + (el.dataset.wie === "tage" ? "_Einzelschichten" : "_Summen") + ".csv";
      csvLaden(name, el.dataset.wie === "tage" ? zeCsvTage() : zeCsvSummen());
      return true;
    }

    /* ---- Sprung aus der Planung in den Abschluss ---- */
    case "zagoto":
      ui.adminTab = "time"; ui.zaStep = "close"; ui.zaDay = null; render(); return true;

    /* ---- Einstellung: ab welchem Monat die Zeiterfassung Pflicht ist ---- */
    case "zasavefirst": {
      const v = String(config.timeFirstYm || "").trim();
      ui.formInfo = "";
      if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(v)){
        ui.zeFehler = "Bitte Jahr und Monat eintragen, zum Beispiel 2026-11.";
        render(); return true;
      }
      const okay = await write(sb.from("settings").update({time_first_ym:v}).eq("id", 1));
      if(okay){ ui.formInfo = "Gespeichert."; await reload(); }
      else render();
      return true;
    }
  }
  return false;
}

/* Zusatz für die Dialoge „Zuteilungen leeren“ und „Monat zurücksetzen“:
   erfasste Zeiten überleben beides (sie hängen nicht am Plan), aber das
   Büro soll es vorher wissen. */
function zeHinweisPlan(){
  const t = zeiten();
  const n = t.rows.length;
  if(!n) return "";
  let s = " Für diesen Monat sind schon " + n + (n === 1 ? " Schicht" : " Schichten")
    + " in der Zeiterfassung erfasst. Die bleiben erhalten; die Vorschläge aus dem Plan sind danach aber weg.";
  if(t.closed) s += " Der Monat ist in der Zeiterfassung abgeschlossen — eine schon ausgelieferte CSV "
    + "passt danach nicht mehr zum Plan.";
  return s;
}

  ui.zeOpen = null; ui.zeForm = null; ui.zaDay = null;

/* Eingaben im Editor: Zustand merken und nur den Rechenkasten nachführen */
function zeInput(t){
  const feld = t.dataset.ze;
  if(!ui.zeForm) return true;
  if(feld === "brk" || feld === "lead") ui.zeForm[feld] = zeParseHM(t.value);

  else ui.zeForm[feld] = t.value;

  return true;
}
/* ============================================================
   Dialog und Druckvorschau
   ============================================================ */
function ask(text, okLabel, cb){ pending = {text, okLabel, cb}; render(); }

function viewDialog(){
  if(!pending) return "";
  return `<div class="overlay"><div class="card dialog">
    <p>${esc(pending.text)}</p>
    <div class="row">
      <button class="btn" data-act="dlg-no">Abbrechen</button>
      <button class="btn primary" data-act="dlg-yes">${esc(pending.okLabel)}</button>
    </div>
  </div></div>`;
}

function viewSheet(){
  if(!ui.sheetOpen) return "";
  return `<div class="overlay"><div class="sheetwrap">
    <div class="sheetbar">
      <span class="t">Druckvorschau</span>
      <button class="btn" data-act="sheet-print">Drucken</button>
      <button class="btn" data-act="sheet-close">Schließen</button>
    </div>
    <div class="sheet">${buildPrint()}</div>
  </div></div>`;
}

function buildPrint(){
  const k = ui.monthKey;
  const n = daysInMonth(k);
  let rows = "", first = true;

  for(let d = 1; d <= n; d++){
    const day = month.days[d];
    if(!day) continue;
    const wd = weekdayOf(k, d);
    const we = (wd === 5 || wd === 6) ? " pd-we" : "";
    const tag = WD_SHORT[wd] + " " + d + ".";
    const head = "pd-start" + (first ? " pd-first" : "") + we;
    first = false;

    if(day.closed || !day.shifts.length){
      rows += `<tr class="${head}"><td class="pd-day">${tag}</td>`
        + `<td class="pd-rest" colspan="2">${day.closed ? "Ruhetag" : "keine Schichten"}</td></tr>`;
      continue;
    }

    const span = day.shifts.length + (day.comment ? 1 : 0);
    day.shifts.forEach((sh, i) => {
      rows += `<tr class="${i === 0 ? head : we.trim()}">`
        + (i === 0 ? `<td class="pd-day" rowspan="${span}">${tag}</td>` : "")
        + `<td class="pd-time">${sh.start}–${sh.end}</td>`
        + `<td class="pd-who">${sh.emp
            ? esc(personName(sh.emp)) + (sh.sl ? `<span class="pd-sl">SL</span>` : "")
            : `<span class="pd-open">offen</span>`}</td></tr>`;
    });
    if(day.comment) rows += `<tr class="${we.trim()}"><td class="pd-note" colspan="2">${esc(day.comment)}</td></tr>`;
  }

  const sum = teamList().map(p => {
    const c = payroll(p.id).shifts;
    return c ? `<span>${esc(p.name)}: ${c}</span>` : "";
  }).join("");

  const html = `
    <h1>Dienstplan ${esc(monthLabel(k))}</h1>
    <p class="pd-sub">Bar Rennbahn Schwabing · Stand ${new Date().toLocaleDateString("de-DE")}</p>
    <table>
      <colgroup><col style="width:64px"><col style="width:106px"><col></colgroup>
      <thead><tr><th>Tag</th><th>Zeit</th><th>Wer</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="pd-sum"><b>Schichten je Person:</b> ${sum || "noch nichts verteilt"}
      <br>SL = Schichtleitung</div>`;

  document.getElementById("printRoot").innerHTML = `<div class="sheet">${html}</div>`;
  return html;
}

/* ============================================================
   Planungslogik
   ============================================================ */
async function assign(day, shiftId, userId){
  const d = month.days[day];
  if(!d) return;
  const sh = d.shifts.find(s => s.id === shiftId);
  if(!sh) return;

  /* Vertragsstunden: warnen, bevor jemand darüber hinaus eingeteilt wird */
  const p = people.find(x => x.id === userId);
  const pr = payroll(userId);
  if(p && !p.minijob && pr.soll > 0){
    const frei = d.shifts.filter(s => s.emp === userId && s.id !== shiftId)
      .reduce((sum, s) => sum + hoursOf(s), 0);
    const neuStd = pr.hours - frei + hoursOf(sh);
    if(neuStd > pr.soll + 0.001 && pr.hours <= pr.soll + 0.001){
      ask(p.name + " kommt damit auf " + dec(neuStd) + " von " + dec(pr.soll)
        + " Vertragsstunden. Trotzdem einteilen?", "Einteilen",
        () => setzeEin(day, shiftId, userId));
      return;
    }
  }
  await setzeEin(day, shiftId, userId);
}

async function setzeEin(day, shiftId, userId){
  const d = month.days[day];
  if(!d) return;
  const freed = d.shifts.filter(s => s.emp === userId && s.id !== shiftId);
  freed.forEach(s => { s.emp = null; s.sl = false; });
  const sh = d.shifts.find(s => s.id === shiftId);
  if(!sh) return;
  sh.emp = userId;

  /* Die erste Schicht des Tages ist im Normalfall die Schichtleitung.
     Nur wenn die Person dafür vorgesehen ist und noch niemand sonst leitet. */
  const erste = d.shifts.indexOf(sh) === 0;
  const schonGeleitet = d.shifts.some(s => s.sl && s.emp && s.id !== sh.id);
  if(erste && canLead(userId) && !schonGeleitet) sh.sl = true;
  if(!canLead(userId)) sh.sl = false;

  ui.selection = null;
  render();

  for(const s of freed) await write(sb.from("shifts").update({assignee:null, is_lead:false}).eq("id", s.id));
  await write(sb.from("shifts").update({assignee:userId, is_lead:sh.sl}).eq("id", shiftId));
}

/* Vorschlag in vier Durchgängen:
   1. Festangestellte führen die Schichten, bis ihre Vertragsstunden stehen
   2. Festangestellte füllen die Abendschichten, bis das Soll erreicht ist
   3. offene Schichtleitungen gehen an die übrigen geeigneten Leute
   4. der Rest wird gleichmäßig verteilt
   Niemand wird dabei über seine Grenze geschoben: Minijob über den Betrag,
   Festanstellung über die Vertragsstunden. */
async function suggestFill(){
  const team = teamList();
  const stand = {};
  team.forEach(p => { const pr = payroll(p.id); stand[p.id] = {pay:pr.pay, hours:pr.hours}; });
  const changes = [];

  const soll = p => (!p.minijob && Number(p.soll) > 0) ? Number(p.soll) : 0;
  const fest = team.filter(p => soll(p) > 0);
  const kosten = (sh, sl) => hoursOf(sh) * (sl ? config.wageSL : config.wage);
  const rueckstand = p => soll(p) - stand[p.id].hours;

  const frei = (p, tag) => !isOff(p.id, tag) && !month.days[tag].shifts.some(s => s.emp === p.id);
  const erlaubt = (p, sh, sl) => {
    if(p.minijob) return !(config.limitOn && stand[p.id].pay + kosten(sh, sl) > config.limit);
    return soll(p) === 0 || stand[p.id].hours + hoursOf(sh) <= soll(p) + 0.001;
  };
  /* Auslastung im Verhältnis zur eigenen Grenze, damit beide Gruppen vergleichbar sind */
  const last = p => p.minijob
    ? (config.limitOn && config.limit > 0 ? stand[p.id].pay / config.limit : stand[p.id].hours / 160)
    : (soll(p) > 0 ? stand[p.id].hours / soll(p) : stand[p.id].hours / 160);

  const setzen = (sh, p, sl) => {
    sh.emp = p.id;
    sh.sl = !!sl;
    stand[p.id].pay += kosten(sh, sl);
    stand[p.id].hours += hoursOf(sh);
    changes.push({id:sh.id, assignee:p.id, is_lead:sh.sl});
  };

  const tage = Object.keys(month.days).map(Number).sort((a, b) => a - b)
    .filter(t => !month.days[t].closed && month.days[t].shifts.length);

  /* 1 — Festangestellte als Schichtleitung, der größte Rückstand zuerst */
  tage.forEach(t => {
    const day = month.days[t];
    if(hasLead(day)) return;
    const sh = day.shifts.find(x => !x.emp);
    if(!sh) return;
    const pool = fest.filter(p => p.can_lead && rueckstand(p) > 0 && frei(p, t) && erlaubt(p, sh, true));
    if(!pool.length) return;
    pool.sort((a, b) => rueckstand(b) - rueckstand(a));
    setzen(sh, pool[0], true);
  });

  /* 2 — Festangestellte an den Abenden, danach notfalls auch früh */
  const fuellen = nurAbend => tage.forEach(t => {
    const day = month.days[t];
    day.shifts.forEach((sh, i) => {
      if(sh.emp) return;
      if(nurAbend && i === 0) return;
      const pool = fest.filter(p => rueckstand(p) > 0 && frei(p, t) && erlaubt(p, sh, false));
      if(!pool.length) return;
      pool.sort((a, b) => rueckstand(b) - rueckstand(a));
      const p = pool[0];
      setzen(sh, p, i === 0 && !hasLead(day) && p.can_lead);
    });
  });
  fuellen(true);
  fuellen(false);

  /* 3 — noch offene Schichtleitungen mit allen übrigen Geeigneten */
  tage.forEach(t => {
    const day = month.days[t];
    if(hasLead(day)) return;
    for(const sh of day.shifts){
      if(sh.emp) continue;
      const pool = team.filter(p => p.can_lead && frei(p, t) && erlaubt(p, sh, true));
      if(!pool.length) continue;
      pool.sort((a, b) => last(a) - last(b));
      setzen(sh, pool[0], true);
      break;
    }
  });

  /* 4 — restliche Schichten gleichmäßig */
  tage.forEach(t => {
    const day = month.days[t];
    day.shifts.forEach(sh => {
      if(sh.emp) return;
      const pool = team.filter(p => frei(p, t) && erlaubt(p, sh, false));
      if(!pool.length) return;                       // lieber offen lassen als eine Grenze reißen
      pool.sort((a, b) => last(a) - last(b));
      setzen(sh, pool[0], false);
    });
  });

  render();
  for(const c of changes) await write(
    sb.from("shifts").update({assignee:c.assignee, is_lead:c.is_lead}).eq("id", c.id));
}

/* ============================================================
   Klicks
   ============================================================ */
async function handleClick(e){
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  const day = Number(el.dataset.day);
  const k = ui.monthKey;

  /* Zeiterfassung zuerst: alles mit ze… und za… wird dort behandelt */
  if((act.slice(0, 2) === "ze" || act.slice(0, 2) === "za") && await zeClick(act, el)) return;

  switch(act){
    case "dlg-no": pending = null; render(); return;
    case "dlg-yes": { const p = pending; pending = null; render(); if(p) await p.cb(); return; }
    case "sheet-close": ui.sheetOpen = false; render(); return;
    case "sheet-print": buildPrint(); try{ window.print(); }catch(err){} return;

    case "authmode":
      ui.authMode = ui.authMode === "reset" ? "login" : "reset";
      ui.authError = ""; ui.authInfo = ""; ui.authDetail = ""; render(); return;
    case "logout": await sb.auth.signOut(); return;
    case "theme": toggleTheme(); return;
    case "tab":
      if(isAdmin()) ui.adminTab = el.dataset.tab; else ui.empTab = el.dataset.tab;
      ui.selection = null; ui.formError = ""; ui.formInfo = "";
      zeSchliessen();
      /* Die Zeiterfassung ist der einzige Reiter, in dem zwei Leute gleichzeitig
         schreiben. Beim Betreten deshalb frisch laden, sonst prüft das Büro
         veraltete Stände. */
      if(el.dataset.tab === "time"){ await reload(); return; }
      render(); return;
    case "month":
      ui.monthKey = shiftMonth(k, Number(el.dataset.dir));
      ui.selection = null; ui.formError = "";
      zeSchliessen();
      await reload(); return;

    /* Mitarbeiter */
    case "toggleoff": {
      const a = availOf(me.id);
      const i = a.off.indexOf(day);
      if(i >= 0) a.off.splice(i, 1); else a.off.push(day);
      a.off.sort((x, y) => x - y);
      a.confirmed = false;
      render();
      await write(sb.from("availability").upsert(
        {ym:k, user_id:me.id, off_days:a.off, confirmed:false}, {onConflict:"ym,user_id"}));
      return;
    }
    case "confirm": {
      const a = availOf(me.id);
      a.confirmed = true;
      render();
      await write(sb.from("availability").upsert(
        {ym:k, user_id:me.id, off_days:a.off, confirmed:true, confirmed_at:new Date().toISOString()},
        {onConflict:"ym,user_id"}));
      return;
    }

    /* Planung */
    case "pick": {
      if(el.classList.contains("used")) return;
      const empId = el.dataset.emp;
      ui.selection = (ui.selection && ui.selection.day === day && ui.selection.empId === empId)
        ? null : {day, empId};
      render(); return;
    }
    case "clear": {
      const sh = month.days[day].shifts.find(s => s.id === el.dataset.shift);
      if(sh){ sh.emp = null; sh.sl = false; }
      render();
      await write(sb.from("shifts").update({assignee:null, is_lead:false}).eq("id", el.dataset.shift));
      return;
    }
    case "togglesl": {
      const sh = month.days[day].shifts.find(s => s.id === el.dataset.shift);
      if(!sh || !sh.emp || !canLead(sh.emp)) return;
      sh.sl = !sh.sl;
      render();
      await write(sb.from("shifts").update({is_lead:sh.sl}).eq("id", sh.id));
      return;
    }
    case "editshift": ui.editingShift = el.dataset.shift; render(); return;
    case "saveshift": {
      const box = el.closest(".slot-edit");
      const sh = month.days[day].shifts.find(s => s.id === el.dataset.shift);
      if(sh && box){
        sh.label = box.querySelector('[data-edit="label"]').value.trim() || "Schicht";
        sh.start = box.querySelector('[data-edit="start"]').value || sh.start;
        sh.end   = box.querySelector('[data-edit="end"]').value || sh.end;
        ui.editingShift = null;
        render();
        await write(sb.from("shifts").update({label:sh.label, starts:sh.start, ends:sh.end}).eq("id", sh.id));
      } else { ui.editingShift = null; render(); }
      return;
    }
    case "delshift": {
      const d = month.days[day];
      const sh = d.shifts.find(s => s.id === el.dataset.shift);
      if(!sh) return;
      const id = sh.id;
      let txt = "Die Schicht " + sh.label + " am " + day + ". wirklich löschen?";
      if(sh.emp) txt += " " + personName(sh.emp) + " ist dafür eingeteilt.";
      if(d.shifts.length === 1) txt += " Der Tag wird damit zum Ruhetag.";
      ask(txt, "Löschen", async () => {
        d.shifts = d.shifts.filter(s => s.id !== id);
        ui.editingShift = null;
        const nowClosed = d.shifts.length === 0;
        if(nowClosed) d.closed = true;
        render();
        await write(sb.from("shifts").delete().eq("id", id));
        if(nowClosed) await write(sb.from("days").update({closed:true}).eq("ym", k).eq("day", day));
      });
      return;
    }
    case "addshift": {
      const d = month.days[day];
      const last = d.shifts[d.shifts.length - 1];
      setSync("saving");
      const {data, error} = await sb.from("shifts").insert({
        ym:k, day, pos:d.shifts.length, label:"Zusatzschicht",
        starts:last ? last.start : "18:00", ends:last ? last.end : "02:00"
      }).select().single();
      if(error){ setSync("bad"); ui.formError = "Nicht gespeichert: " + error.message; render(); return; }
      setSync("ok");
      d.shifts.push({id:data.id, label:data.label, start:data.starts, end:data.ends, emp:null, sl:false, pos:data.pos});
      ui.editingShift = data.id;
      render(); return;
    }
    case "openday": {
      const d = month.days[day];
      d.closed = false;
      render();
      await write(sb.from("days").update({closed:false}).eq("ym", k).eq("day", day));
      if(!d.shifts.length){
        const {data, error} = await sb.from("shifts")
          .insert({ym:k, day, pos:0, label:"Schicht", starts:"18:00", ends:"02:00"}).select().single();
        if(!error) d.shifts.push({id:data.id, label:data.label, start:data.starts, end:data.ends, emp:null, sl:false, pos:0});
      }
      render(); return;
    }
    case "goday": ui.jumpTo = day; render(); return;

    case "suggest":
      ask("Offene Schichten automatisch besetzen? Bereits verteilte Schichten bleiben unverändert.",
        "Vorschlag erstellen", suggestFill);
      return;
    case "print": ui.sheetOpen = true; render(); return;
    case "publish": {
      if(month.published){
        month.published = false; render();
        await write(sb.from("months").update({published:false}).eq("ym", k));
        return;
      }
      const st = monthStats();
      const go = async () => {
        month.published = true; render();
        await write(sb.from("months").update({published:true}).eq("ym", k));
      };
      if(st.filled < st.slots){
        ask("Es sind noch " + (st.slots - st.filled) + " Schichten offen. Trotzdem freigeben?", "Freigeben", go);
        return;
      }
      await go(); return;
    }

    /* Team */
    case "askrole": {
      const p = people.find(x => x.id === el.dataset.emp);
      if(!p || p.id === me.id) return;
      const zu = p.role === "admin" ? "staff" : "admin";
      /* ask() maskiert selbst — der Name geht hier unverändert hinein */
      ask(zu === "admin"
        ? p.name + " den Adminzugang geben? Damit sieht die Person Planung, Löhne und Freigabe "
          + "und wird nicht mehr eingeplant. Schon eingetragene Schichten bleiben stehen."
        : p.name + " den Adminzugang entziehen? Die Person sieht danach nur noch den eigenen "
          + "Kalender und wird wieder eingeplant.",
        zu === "admin" ? "Zugang geben" : "Zugang entziehen",
        async () => {
          p.role = zu;
          p.schedulable = zu !== "admin";          // Büro steht nicht im Dienstplan
          sortPeople();
          render();
          await write(sb.from("profiles").update({role:zu, schedulable:p.schedulable}).eq("id", p.id));
        });
      return;
    }
    case "toggleactive": {
      const p = people.find(x => x.id === el.dataset.emp);
      if(!p) return;
      p.active = !p.active;
      sortPeople();
      render();
      await write(sb.from("profiles").update({active:p.active}).eq("id", p.id));
      return;
    }
    case "toggleplan": {
      const p = people.find(x => x.id === el.dataset.emp);
      if(!p) return;
      p.schedulable = !p.schedulable;
      sortPeople();
      render();
      await write(sb.from("profiles").update({schedulable:p.schedulable}).eq("id", p.id));
      return;
    }
    case "toggleminijob": {
      const p = people.find(x => x.id === el.dataset.emp);
      if(!p) return;
      p.minijob = !p.minijob;
      sortPeople();
      render();
      await write(sb.from("payroll_flags").upsert(
        {user_id:p.id, minijob:p.minijob, target_hours:p.soll || 0}, {onConflict:"user_id"}));
      return;
    }
    case "togglelead": {
      const p = people.find(x => x.id === el.dataset.emp);
      if(!p) return;
      p.can_lead = !p.can_lead;
      const weg = [];
      if(!p.can_lead){                       // Eignung weg, also auch bestehende Kennzeichnungen weg
        Object.values(month.days).forEach(d => d.shifts.forEach(sh => {
          if(sh.emp === p.id && sh.sl){ sh.sl = false; weg.push(sh.id); }
        }));
      }
      render();
      await write(sb.from("profiles").update({can_lead:p.can_lead}).eq("id", p.id));
      for(const id of weg) await write(sb.from("shifts").update({is_lead:false}).eq("id", id));
      return;
    }
    case "rename": ui.renaming = el.dataset.emp; ui.formError = ""; render(); return;
    case "cancelrename": ui.renaming = null; render(); return;
    case "reopen": {
      const id = el.dataset.emp;
      availOf(id).confirmed = false;
      render();
      await write(sb.from("availability").update({confirmed:false}).eq("ym", k).eq("user_id", id));
      return;
    }

    /* Einstellungen */
    case "togglelimiton":
      config.limitOn = !config.limitOn; render();
      await write(sb.from("settings").update({limit_on:config.limitOn}).eq("id", 1));
      return;
    case "savesettings": {
      ui.formInfo = "";
      const ok = await write(sb.from("settings").update({
        wage:config.wage, wage_lead:config.wageSL, limit_amount:config.limit, limit_on:config.limitOn
      }).eq("id", 1));
      if(ok) ui.formInfo = "Gespeichert.";
      render(); return;
    }
    case "tpladd":
      (templates[Number(el.dataset.wd)] = templates[Number(el.dataset.wd)] || [])
        .push({label:"Schicht", start:"18:00", end:"02:00"});
      render(); return;
    case "tpldel": {
      const wd = Number(el.dataset.wd), i = Number(el.dataset.i);
      const row = (templates[wd] || [])[i];
      if(!row) return;
      ask("Die Schicht " + row.label + " am " + WD_LONG[wd] + " aus der Vorlage entfernen? "
        + "Wirksam wird das erst mit \u201eVorlagen speichern\u201c, bereits angelegte Monate bleiben unberührt.",
        "Entfernen", () => { templates[wd].splice(i, 1); render(); });
      return;
    }
    case "savetpl": {
      const rows = [];
      for(let wd = 0; wd < 7; wd++){
        (templates[wd] || []).forEach((s, i) =>
          rows.push({weekday:wd, pos:i, label:s.label, starts:s.start, ends:s.end}));
      }
      setSync("saving");
      const del = await sb.from("shift_templates").delete().gte("weekday", 0);
      if(del.error){ setSync("bad"); ui.formError = del.error.message; render(); return; }
      if(rows.length){
        const ins = await sb.from("shift_templates").insert(rows);
        if(ins.error){ setSync("bad"); ui.formError = ins.error.message; render(); return; }
      }
      setSync("ok");
      ui.formInfo = "Vorlagen gespeichert.";
      render(); return;
    }
    case "clearmonth":
      ask("Alle Zuteilungen in " + monthLabel(k) + " leeren? Schichten und Eintragungen bleiben."
        + zeHinweisPlan(), "Leeren", async () => {
        await write(sb.from("shifts").update({assignee:null, is_lead:false}).eq("ym", k));
        await reload();
      });
      return;
    case "resetmonth":
      ask(monthLabel(k) + " zurücksetzen? Schichten und Zuteilungen werden neu aus den Vorlagen aufgebaut."
        + zeHinweisPlan(), "Zurücksetzen", async () => {
        await write(sb.from("months").delete().eq("ym", k));
        await reload();
      });
      return;
  }
}

/* Antippen statt ziehen */
function handleSlotTap(e){
  if(!ui.selection) return;
  if(e.target.closest("[data-act]")) return;
  const slot = e.target.closest(".slot");
  if(!slot) return;
  const day = Number(slot.dataset.day);
