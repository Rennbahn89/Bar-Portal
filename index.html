   ============================================================ */
async function handleClick(e){
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  const day = Number(el.dataset.day);
  const k = ui.monthKey;

  switch(act){
    case "dlg-no": pending = null; render(); return;
    case "dlg-yes": { const p = pending; pending = null; render(); if(p) await p.cb(); return; }
    case "sheet-close": ui.sheetOpen = false; render(); return;
    case "sheet-print": buildPrint(); try{ window.print(); }catch(err){} return;

    case "authmode":
      ui.authMode = ui.authMode === "reset" ? "login" : "reset";
      ui.authError = ""; ui.authInfo = ""; ui.authDetail = ""; render(); return;
    case "logout": await sb.auth.signOut(); return;
    case "theme": toggleTheme(); return;
    case "tab":
      if(isAdmin()) ui.adminTab = el.dataset.tab; else ui.empTab = el.dataset.tab;
      ui.selection = null; ui.formError = ""; ui.formInfo = ""; render(); return;
    case "month":
      ui.monthKey = shiftMonth(k, Number(el.dataset.dir));
      ui.selection = null; ui.formError = "";
      await reload(); return;

    /* Mitarbeiter */
    case "toggleoff": {
      const a = availOf(me.id);
      const i = a.off.indexOf(day);
      if(i >= 0) a.off.splice(i, 1); else a.off.push(day);
      a.off.sort((x, y) => x - y);
      a.confirmed = false;
      render();
      await write(sb.from("availability").upsert(
        {ym:k, user_id:me.id, off_days:a.off, confirmed:false}, {onConflict:"ym,user_id"}));
      return;
    }
    case "confirm": {
      const a = availOf(me.id);
      a.confirmed = true;
      render();
      await write(sb.from("availability").upsert(
        {ym:k, user_id:me.id, off_days:a.off, confirmed:true, confirmed_at:new Date().toISOString()},
        {onConflict:"ym,user_id"}));
      return;
    }

    /* Planung */
    case "pick": {
      if(el.classList.contains("used")) return;
      const empId = el.dataset.emp;
      ui.selection = (ui.selection && ui.selection.day === day && ui.selection.empId === empId)
        ? null : {day, empId};
      render(); return;
    }
    case "clear": {
      const sh = month.days[day].shifts.find(s => s.id === el.dataset.shift);
      if(sh){ sh.emp = null; sh.sl = false; }
      render();
      await write(sb.from("shifts").update({assignee:null, is_lead:false}).eq("id", el.dataset.shift));
      return;
    }
    case "togglesl": {
      const sh = month.days[day].shifts.find(s => s.id === el.dataset.shift);
      if(!sh || !sh.emp || !canLead(sh.emp)) return;
      sh.sl = !sh.sl;
      render();
      await write(sb.from("shifts").update({is_lead:sh.sl}).eq("id", sh.id));
      return;
    }
    case "editshift": ui.editingShift = el.dataset.shift; render(); return;
    case "saveshift": {
      const box = el.closest(".slot-edit");
      const sh = month.days[day].shifts.find(s => s.id === el.dataset.shift);
      if(sh && box){
        sh.label = box.querySelector('[data-edit="label"]').value.trim() || "Schicht";
        sh.start = box.querySelector('[data-edit="start"]').value || sh.start;
        sh.end   = box.querySelector('[data-edit="end"]').value || sh.end;
        ui.editingShift = null;
        render();
        await write(sb.from("shifts").update({label:sh.label, starts:sh.start, ends:sh.end}).eq("id", sh.id));
      } else { ui.editingShift = null; render(); }
      return;
    }
    case "delshift": {
      const d = month.days[day];
      const sh = d.shifts.find(s => s.id === el.dataset.shift);
      if(!sh) return;
      const id = sh.id;
      let txt = "Die Schicht " + sh.label + " am " + day + ". wirklich löschen?";
      if(sh.emp) txt += " " + personName(sh.emp) + " ist dafür eingeteilt.";
      if(d.shifts.length === 1) txt += " Der Tag wird damit zum Ruhetag.";
      ask(txt, "Löschen", async () => {
        d.shifts = d.shifts.filter(s => s.id !== id);
        ui.editingShift = null;
        const nowClosed = d.shifts.length === 0;
        if(nowClosed) d.closed = true;
        render();
        await write(sb.from("shifts").delete().eq("id", id));
        if(nowClosed) await write(sb.from("days").update({closed:true}).eq("ym", k).eq("day", day));
      });
      return;
    }
    case "addshift": {
      const d = month.days[day];
      const last = d.shifts[d.shifts.length - 1];
      setSync("saving");
      const {data, error} = await sb.from("shifts").insert({
        ym:k, day, pos:d.shifts.length, label:"Zusatzschicht",
        starts:last ? last.start : "18:00", ends:last ? last.end : "02:00"
      }).select().single();
      if(error){ setSync("bad"); ui.formError = "Nicht gespeichert: " + error.message; render(); return; }
      setSync("ok");
      d.shifts.push({id:data.id, label:data.label, start:data.starts, end:data.ends, emp:null, sl:false, pos:data.pos});
      ui.editingShift = data.id;
      render(); return;
    }
    case "openday": {
      const d = month.days[day];
      d.closed = false;
      render();
      await write(sb.from("days").update({closed:false}).eq("ym", k).eq("day", day));
      if(!d.shifts.length){
        const {data, error} = await sb.from("shifts")
          .insert({ym:k, day, pos:0, label:"Schicht", starts:"18:00", ends:"02:00"}).select().single();
        if(!error) d.shifts.push({id:data.id, label:data.label, start:data.starts, end:data.ends, emp:null, sl:false, pos:0});
      }
      render(); return;
    }
    case "goday": ui.jumpTo = day; render(); return;

    case "suggest":
      ask("Offene Schichten automatisch besetzen? Bereits verteilte Schichten bleiben unverändert.",
        "Vorschlag erstellen", suggestFill);
      return;
    case "print": ui.sheetOpen = true; render(); return;
    case "publish": {
      if(month.published){
        month.published = false; render();
        await write(sb.from("months").update({published:false}).eq("ym", k));
        return;
      }
      const st = monthStats();
      const go = async () => {
        month.published = true; render();
        await write(sb.from("months").update({published:true}).eq("ym", k));
      };
      if(st.filled < st.slots){
        ask("Es sind noch " + (st.slots - st.filled) + " Schichten offen. Trotzdem freigeben?", "Freigeben", go);
        return;
      }
      await go(); return;
    }

    /* Team */
    case "askrole": {
      const p = people.find(x => x.id === el.dataset.emp);
      if(!p || p.id === me.id) return;
      const zu = p.role === "admin" ? "staff" : "admin";
      /* ask() maskiert selbst — der Name geht hier unverändert hinein */
      ask(zu === "admin"
        ? p.name + " den Adminzugang geben? Damit sieht die Person Planung, Löhne und Freigabe "
          + "und wird nicht mehr eingeplant. Schon eingetragene Schichten bleiben stehen."
        : p.name + " den Adminzugang entziehen? Die Person sieht danach nur noch den eigenen "
          + "Kalender und wird wieder eingeplant.",
        zu === "admin" ? "Zugang geben" : "Zugang entziehen",
        async () => {
          p.role = zu;
          p.schedulable = zu !== "admin";          // Büro steht nicht im Dienstplan
          sortPeople();
          render();
          await write(sb.from("profiles").update({role:zu, schedulable:p.schedulable}).eq("id", p.id));
        });
      return;
    }
    case "toggleactive": {
      const p = people.find(x => x.id === el.dataset.emp);
      if(!p) return;
      p.active = !p.active;
      sortPeople();
      render();
      await write(sb.from("profiles").update({active:p.active}).eq("id", p.id));
      return;
    }
    case "toggleplan": {
      const p = people.find(x => x.id === el.dataset.emp);
      if(!p) return;
      p.schedulable = !p.schedulable;
      sortPeople();
      render();
      await write(sb.from("profiles").update({schedulable:p.schedulable}).eq("id", p.id));
      return;
    }
    case "toggleminijob": {
      const p = people.find(x => x.id === el.dataset.emp);
      if(!p) return;
      p.minijob = !p.minijob;
      sortPeople();
      render();
      await write(sb.from("payroll_flags").upsert(
        {user_id:p.id, minijob:p.minijob, target_hours:p.soll || 0}, {onConflict:"user_id"}));
      return;
    }
    case "togglelead": {
      const p = people.find(x => x.id === el.dataset.emp);
      if(!p) return;
      p.can_lead = !p.can_lead;
      const weg = [];
      if(!p.can_lead){                       // Eignung weg, also auch bestehende Kennzeichnungen weg
        Object.values(month.days).forEach(d => d.shifts.forEach(sh => {
          if(sh.emp === p.id && sh.sl){ sh.sl = false; weg.push(sh.id); }
        }));
      }
      render();
      await write(sb.from("profiles").update({can_lead:p.can_lead}).eq("id", p.id));
      for(const id of weg) await write(sb.from("shifts").update({is_lead:false}).eq("id", id));
      return;
    }
    case "rename": ui.renaming = el.dataset.emp; ui.formError = ""; render(); return;
    case "cancelrename": ui.renaming = null; render(); return;
    case "reopen": {
      const id = el.dataset.emp;
      availOf(id).confirmed = false;
      render();
      await write(sb.from("availability").update({confirmed:false}).eq("ym", k).eq("user_id", id));
      return;
    }

    /* Einstellungen */
    case "togglelimiton":
      config.limitOn = !config.limitOn; render();
      await write(sb.from("settings").update({limit_on:config.limitOn}).eq("id", 1));
      return;
    case "savesettings": {
      ui.formInfo = "";
      const ok = await write(sb.from("settings").update({
        wage:config.wage, wage_lead:config.wageSL, limit_amount:config.limit, limit_on:config.limitOn
      }).eq("id", 1));
      if(ok) ui.formInfo = "Gespeichert.";
      render(); return;
    }
    case "tpladd":
      (templates[Number(el.dataset.wd)] = templates[Number(el.dataset.wd)] || [])
        .push({label:"Schicht", start:"18:00", end:"02:00"});
      render(); return;
    case "tpldel": {
      const wd = Number(el.dataset.wd), i = Number(el.dataset.i);
      const row = (templates[wd] || [])[i];
      if(!row) return;
      ask("Die Schicht " + row.label + " am " + WD_LONG[wd] + " aus der Vorlage entfernen? "
        + "Wirksam wird das erst mit \u201eVorlagen speichern\u201c, bereits angelegte Monate bleiben unberührt.",
        "Entfernen", () => { templates[wd].splice(i, 1); render(); });
      return;
    }
    case "savetpl": {
      const rows = [];
      for(let wd = 0; wd < 7; wd++){
        (templates[wd] || []).forEach((s, i) =>
          rows.push({weekday:wd, pos:i, label:s.label, starts:s.start, ends:s.end}));
      }
      setSync("saving");
      const del = await sb.from("shift_templates").delete().gte("weekday", 0);
      if(del.error){ setSync("bad"); ui.formError = del.error.message; render(); return; }
      if(rows.length){
        const ins = await sb.from("shift_templates").insert(rows);
        if(ins.error){ setSync("bad"); ui.formError = ins.error.message; render(); return; }
      }
      setSync("ok");
      ui.formInfo = "Vorlagen gespeichert.";
      render(); return;
    }
    case "clearmonth":
      ask("Alle Zuteilungen in " + monthLabel(k) + " leeren? Schichten und Eintragungen bleiben.", "Leeren", async () => {
        await write(sb.from("shifts").update({assignee:null, is_lead:false}).eq("ym", k));
        await reload();
      });
      return;
    case "resetmonth":
      ask(monthLabel(k) + " zurücksetzen? Schichten und Zuteilungen werden neu aus den Vorlagen aufgebaut.", "Zurücksetzen", async () => {
        await write(sb.from("months").delete().eq("ym", k));
        await reload();
      });
      return;
  }
}

/* Antippen statt ziehen */
function handleSlotTap(e){
  if(!ui.selection) return;
  if(e.target.closest("[data-act]")) return;
  const slot = e.target.closest(".slot");
  if(!slot) return;
  const day = Number(slot.dataset.day);
  if(day !== ui.selection.day) return;
  assign(day, slot.dataset.shift, ui.selection.empId);
}

/* ============================================================
   Ziehen und Ablegen
   ============================================================ */
function onDragStart(e){
  const chip = e.target.closest("[draggable='true']");
  if(!chip) return;
  const art = chip.dataset.drag === "person" ? "person" : "schicht";
  dragData = {art, empId: chip.dataset.emp, from: chip.dataset.from || null};
  if(art === "person"){
    const karte = chip.closest(".pcard");
    if(karte){
      /* Die ganze Karte als Schattenbild, nicht nur der kleine Griff */
      try{ e.dataTransfer.setDragImage(karte, 24, 18); }catch(err){}
      karte.classList.add("dragging");
    }
  } else {
    chip.classList.add("drag");
  }
  try{
    e.dataTransfer.setData("text/plain", chip.dataset.emp);
    e.dataTransfer.effectAllowed = "move";
  }catch(err){}
}
function onDragEnd(){
  dragData = null;
  spurenWeg();
}

/* Nur die Ablegelinie, die beim Überfahren mitwandert */
function markenWeg(){
  document.querySelectorAll(".pcard.dropbefore, .pcard.dropafter")
    .forEach(el => el.classList.remove("dropbefore", "dropafter"));
}
/* Alles, was ein Zug am Bildschirm hinterlässt */
function spurenWeg(){
  markenWeg();
  document.querySelectorAll(".drag, .slot.over, .pcard.dragging")
    .forEach(el => el.classList.remove("drag", "over", "dragging"));
}
const untereHaelfte = (el, y) => {
  const r = el.getBoundingClientRect();
  return r.height > 0 && y > r.top + r.height / 2;
};
/* Nur innerhalb derselben Gruppe darf abgelegt werden */
function zielKarte(e){
  if(!dragData || dragData.art !== "person") return null;
  const karte = e.target.closest(".pcard[data-drop='person']");
  if(!karte || karte.dataset.emp === dragData.empId) return null;
  const p = people.find(x => x.id === dragData.empId);
  const q = people.find(x => x.id === karte.dataset.emp);
  if(!p || !q || personRank(p) !== personRank(q)) return null;
  return karte;
}

function onDragOver(e){
  if(!dragData) return;
  if(dragData.art === "person"){
    const karte = zielKarte(e);
    if(!karte) return;
    e.preventDefault();
    markenWeg();
    karte.classList.add(untereHaelfte(karte, e.clientY) ? "dropafter" : "dropbefore");
    return;
  }
  if(!e.target.closest(".slot")) return;
  e.preventDefault();
  e.target.closest(".slot").classList.add("over");
}
function onDragLeave(e){
  const slot = e.target.closest(".slot");
  if(slot) slot.classList.remove("over");
}
async function onDrop(e){
  if(!dragData) return;

  if(dragData.art === "person"){
    const karte = zielKarte(e);
    spurenWeg();
    if(!karte) return;
    e.preventDefault();
    const von = dragData.empId;
    dragData = null;
    await dropPerson(von, karte.dataset.emp, untereHaelfte(karte, e.clientY));
    return;
  }

  const slot = e.target.closest(".slot");
  if(!slot) return;
  e.preventDefault();
  const day = Number(slot.dataset.day);
  const empId = dragData.empId;
  const from = dragData.from;
  dragData = null;
  if(from && Number(from.split(":")[0]) !== day) return;   // nur innerhalb eines Tages
  if(isOff(empId, day)) return;
  await assign(day, slot.dataset.shift, empId);
}

/* ============================================================
   Formulare
   ============================================================ */
async function onSubmit(e){
  const form = e.target.closest("form");
  if(!form) return;
  e.preventDefault();
  const kind = form.dataset.form;

  if(kind === "login"){
    ui.authError = ""; ui.authInfo = ""; ui.authDetail = "";
    const {error} = await sb.auth.signInWithPassword({
      email: feldWert(form, "email").trim(), password: feldWert(form, "pw")
    });
    if(error){ ui.authError = "Anmeldung fehlgeschlagen. Prüfe E-Mail-Adresse und Passwort."; render(); return; }
    await boot();
    return;
  }

  if(kind === "reset"){
    ui.authError = ""; ui.authInfo = ""; ui.authDetail = "";
    const {error} = await sb.auth.resetPasswordForEmail(feldWert(form, "email").trim(),
      {redirectTo: location.origin + location.pathname});
    if(error) ui.authError = error.message;
    else ui.authInfo = "Wenn es zu dieser Adresse ein Konto gibt, ist die Mail unterwegs.";
    render(); return;
  }

  if(kind === "onboard"){
    ui.formError = "";
    const name = feldWert(form, "name").trim();
    const pw = feldWert(form, "pw"), pw2 = feldWert(form, "pw2");
    if(!name){ ui.formError = "Bitte trag deinen Vornamen ein."; render(); return; }
    if(pw.length < 8){ ui.formError = "Das Passwort braucht mindestens acht Zeichen."; render(); return; }
    if(pw !== pw2){ ui.formError = "Die beiden Passwörter stimmen nicht überein."; render(); return; }
    const up = await sb.auth.updateUser({password: pw});
    if(up.error){ ui.formError = up.error.message; render(); return; }
    const pr = await sb.from("profiles").update({name}).eq("id", me.id);
    if(pr.error){ ui.formError = pr.error.message; render(); return; }
    me.name = name;
    setupDone();
    ui.screen = "app";
    ui.monthKey = monthKey(new Date());
    await reload();
    return;
  }

  if(kind === "rename"){
    const p = people.find(x => x.id === form.dataset.emp);
    if(!p) return;
    const name = feldWert(form, "name").trim();
    if(!name){ ui.formError = "Der Name darf nicht leer sein."; render(); return; }
    p.name = name;
    if(p.id === me.id) me.name = name;
    sortPeople();
    ui.renaming = null;
    ui.formError = "";
    render();
    await write(sb.from("profiles").update({name}).eq("id", p.id));
    return;
  }

  if(kind === "account"){
    ui.formError = ""; ui.formInfo = "";
    const name = feldWert(form, "name").trim();
    const pw = feldWert(form, "pw");
    if(!name){ ui.formError = "Der Vorname darf nicht leer sein."; render(); return; }
    if(pw && pw.length < 8){ ui.formError = "Das Passwort braucht mindestens acht Zeichen."; render(); return; }
    if(pw){
      const up = await sb.auth.updateUser({password: pw});
      if(up.error){ ui.formError = up.error.message; render(); return; }
    }
    const pr = await sb.from("profiles").update({name}).eq("id", me.id);
    if(pr.error){ ui.formError = pr.error.message; render(); return; }
    me.name = name;
    const p = people.find(x => x.id === me.id);
    if(p) p.name = name;
    ui.formInfo = pw ? "Name und Passwort gespeichert." : "Name gespeichert.";
    render(); return;
  }
}

/* Eingaben ohne Neuzeichnen übernehmen, sonst springt der Cursor */
let noteTimer = null, sollTimer = null;
function onInput(e){
  const t = e.target;

  if(t.dataset.note !== undefined){
    const day = Number(t.dataset.note);
    month.days[day].comment = t.value;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      write(sb.from("days").update({note: month.days[day].comment}).eq("ym", ui.monthKey).eq("day", day));
    }, 700);
    return;
  }
  if(t.dataset.soll !== undefined){
    const p = people.find(x => x.id === t.dataset.soll);
    if(!p) return;
    p.soll = toNum(t.value);
    clearTimeout(sollTimer);
    sollTimer = setTimeout(() => {
      write(sb.from("payroll_flags").upsert(
        {user_id:p.id, minijob:p.minijob, target_hours:p.soll}, {onConflict:"user_id"}));
    }, 700);
    return;
  }
  if(t.dataset.cfg){ config[t.dataset.cfg] = toNum(t.value); return; }
  if(t.dataset.tpl !== undefined && t.dataset.f){
    const arr = templates[Number(t.dataset.tpl)];
    const row = arr && arr[Number(t.dataset.i)];
    if(row) row[t.dataset.f] = t.value;
  }
}

/* ============================================================
   Zeichnen
   ============================================================ */
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme");
  const darkPreferred = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur === "dark" ? "light" : cur === "light" ? "dark" : (darkPreferred ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
}

function render(){
  const app = document.getElementById("app");
  const board = document.getElementById("board");
  const keepScroll = board ? board.scrollLeft : 0;

  if(ui.screen === "error"){ app.innerHTML = `<div class="boot">${esc(ui.bootMsg)}</div>`; return; }
  if(ui.screen === "boot"){ app.innerHTML = `<div class="boot">Wird geladen…</div>`; return; }
  if(ui.screen === "auth"){ app.innerHTML = viewAuth(); return; }
  if(ui.screen === "onboard"){ app.innerHTML = viewOnboard(); return; }
  if(!month){ app.innerHTML = `<div class="boot">Wird geladen…</div>`; return; }

  app.innerHTML = isAdmin()
    ? viewAdmin() + viewSheet() + viewDialog()
    : viewStaff() + viewDialog();

  setSync(ui.sync);

  const fresh = document.getElementById("board");
  if(fresh){
    if(ui.jumpTo){
      const col = fresh.querySelector('.col[data-col="' + ui.jumpTo + '"]');
      ui.jumpTo = null;
      if(col){
        const left = col.offsetLeft - fresh.offsetLeft;
        try{ fresh.scrollTo({left, behavior:"smooth"}); }
        catch(e){ fresh.scrollLeft = left; }
      }
    } else if(keepScroll){
      fresh.scrollLeft = keepScroll;          // hart, sonst wandert die Ansicht sichtbar
    }
  }
  const details = app.querySelector(".checklist");
  if(details) details.addEventListener("toggle", () => { ui.checkOpen = details.open; });

  const namensfeld = app.querySelector(".renameform input");
  if(namensfeld){ namensfeld.focus(); namensfeld.select(); }
}

/* ============================================================
   Start
   ============================================================ */
function cleanUrl(){
  try{ history.replaceState({}, document.title, location.pathname); }catch(e){}
}

/* Einladungs- oder Wiederherstellungslink in eine Sitzung verwandeln.
   Jeder Fehlweg endet mit einer Meldung, die sagt, was zu tun ist. */
async function consumeLink(){
  if(linkHandled) return;   // sonst wird ein alter Anhang nach jeder Anmeldung erneut geprüft
  linkHandled = true;

  const scheitern = (text, detail) => {
    ui.authError = text;
    ui.authDetail = detail || "";
    setupDone();
    cleanUrl();
  };

  if(linkError){
    scheitern("Dieser Link ist nicht mehr gültig. Einladungs- und Passwortlinks lassen sich nur einmal öffnen. "
      + "Melde dich unten mit E-Mail und Passwort an oder fordere über \u201ePasswort vergessen\u201c einen neuen Link an.",
      "Rückmeldung des Servers: " + linkError);
    return;
  }

  if(linkType === "invite" || linkType === "recovery"){
    try{ localStorage.setItem(SETUP_KEY, "1"); }catch(e){}
  }

  if(linkAccess && linkRefresh){
    const {error} = await sb.auth.setSession({access_token:linkAccess, refresh_token:linkRefresh});
    if(error) scheitern("Der Link konnte nicht eingelöst werden. Melde dich unten mit E-Mail und Passwort an "
      + "oder fordere einen neuen Link an.", error.message);
    else cleanUrl();
    return;
  }

  if(linkCode){
    const {error} = await sb.auth.exchangeCodeForSession(linkCode);
    if(error) scheitern("Dieser Link lässt sich nur in dem Browser öffnen, in dem er angefordert wurde. "
      + "Melde dich unten mit E-Mail und Passwort an oder fordere hier einen neuen Link an.", error.message);
    else cleanUrl();
    return;
  }

  /* Bruchstück eines Links: etwas war dabei, aber nicht genug */
  if(linkType || linkAccess || linkRefresh){
    scheitern("Der Link war unvollständig — das passiert, wenn eine Mail-App ihn kürzt oder vorab öffnet. "
      + "Melde dich unten mit E-Mail und Passwort an oder fordere einen neuen Link an.",
      "im Link enthalten: " + [linkType && "type", linkAccess && "access_token", linkRefresh && "refresh_token"]
        .filter(Boolean).join(", "));
  }
}

function setupOpen(){
  try{ return localStorage.getItem(SETUP_KEY) === "1"; }catch(e){ return false; }
}
function setupDone(){
  try{ localStorage.removeItem(SETUP_KEY); }catch(e){}
}

/* Prüft vor allem anderen, ob Adresse und Schlüssel überhaupt stimmen.
   Ohne das enden Tippfehler in kryptischen Meldungen mitten im Ablauf. */
async function probe(){
  if(!API_URL) return "In der Datei fehlt die SUPABASE_URL.";
  if(API_KEY.length < 30) return "Der SUPABASE_ANON_KEY sieht unvollständig aus.";
  let res;
  try{
    res = await fetch(API_URL + "/auth/v1/health", {headers:{apikey:API_KEY}});
  }catch(e){
    return "Unter " + API_URL + " ist kein Supabase-Projekt erreichbar. "
      + "Prüfe die Project URL in der index.html.";
  }
  if(res.ok) return "";
  if(res.status === 401 || res.status === 403)
    return "Adresse erreichbar, aber der SUPABASE_ANON_KEY wird abgelehnt. "
      + "Hol ihn nochmal aus Project Settings, API.";
  return "Der Server unter " + API_URL + " antwortet mit Status " + res.status
    + ". Prüfe die Project URL in der index.html.";
}

async function boot(){
  ui.screen = "boot"; render();

  const trouble = await probe();
  if(trouble){ ui.bootMsg = trouble; ui.screen = "error"; render(); return; }

  await consumeLink();

  const profile = await loadProfile();
  if(!profile){
    ui.screen = ui.bootMsg ? "error" : "auth";
    render(); return;
  }
  me = profile;

  /* Nach Einladung oder Zurücksetzen zuerst Vorname und Passwort festlegen */
  if(setupOpen() || !me.name){
    ui.screen = "onboard"; render(); return;
  }

  ui.screen = "app";
  ui.monthKey = monthKey(new Date());   // beim Öffnen immer der laufende Monat
  await reload();
}

try{
  const th = localStorage.getItem(THEME_KEY);
  if(th) document.documentElement.setAttribute("data-theme", th);
}catch(e){}

ui.monthKey = monthKey(new Date());
ui.checkOpen = window.innerWidth > 760;

document.addEventListener("click", e => { handleClick(e); handleSlotTap(e); });
document.addEventListener("submit", onSubmit);
document.addEventListener("input", onInput);
document.addEventListener("dragstart", onDragStart);
document.addEventListener("dragend", onDragEnd);
document.addEventListener("dragover", onDragOver);
document.addEventListener("dragleave", onDragLeave);
document.addEventListener("drop", onDrop);

sb.auth.onAuthStateChange(event => {
  if(event === "SIGNED_OUT"){
    me = null; month = null; people = [];
    setupDone();
    ui.screen = "auth"; ui.authError = ""; ui.authInfo = ""; ui.authDetail = "";
    render();
  }
});

if(SUPABASE_URL.indexOf("DEIN-PROJEKT") >= 0){
  document.getElementById("app").innerHTML =
    `<div class="boot">Bitte oben im Quelltext SUPABASE_URL und SUPABASE_ANON_KEY eintragen.</div>`;
} else {
  boot();
}
